<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>일정 캘린더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
/* 외부 공개용 캘린더 — /api/schedule 결과만 그림 (운영페이지 캘린더와 같은 모양). 업무(kind:'task')는 눌러서 담당자·상세를 보기만 */
:root{
  --ink:#121214; --mut:#7A8194; --line:#ECEDF1; --paper:#F4F5F9; --accent:#2563EB; --sun:#D2452F;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:16px}
.card{background:rgba(255,255,255,.66);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.55),0 20px 40px -26px rgba(20,22,28,.28),0 2px 6px -2px rgba(20,22,28,.06);overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 12px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:15px;font-weight:700}
.nav{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px}
.nav button{border:0;background:none;width:30px;height:30px;cursor:pointer;color:var(--mut);font:inherit;font-size:15px}
.nav button:hover{color:var(--ink)}
.nav .today{width:auto;padding:0 10px;font-size:12px;font-weight:600;color:var(--ink);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 12px 12px}
.dow{font-size:12px;color:var(--mut);padding:12px 10px 8px}
.dow.sun{color:var(--sun)}
.cell{min-height:118px;padding:6px 0 8px;border-top:1px solid var(--line);min-width:0}
.cell.out .d{visibility:hidden}
.d{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;margin:0 0 4px 6px;font-size:13px;font-weight:600;border-radius:7px}
.cell.sun .d{color:var(--sun)}
.cell.past .d{color:#A3A8B5}
.cell.today .d{background:var(--accent);color:#fff;padding:0 6px}
.ev{display:flex;align-items:center;gap:5px;height:26px;margin:4px 3px 0;padding:0 7px;border-radius:6px;border:1px solid hsl(var(--h) 42% 82%);background:hsl(var(--h) 45% 95%);color:hsl(var(--h) 45% 28%);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{overflow:hidden;text-overflow:ellipsis}
.ev .o{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;opacity:.55}
.ev.done{opacity:.5}
.ev.done .t{text-decoration:line-through}
.ev.done .o{background:currentColor}
.ev.task{border-style:dashed}
.ev.task .o{border-radius:3px}
.ev .who{flex:none;font-weight:500;opacity:.7}
.info dt{font-size:12px;color:var(--mut);margin:0 0 2px}
.info dd{margin:0 0 12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bar{height:26px;margin:4px 0 0;display:flex;align-items:center}
.bar::before{content:'';display:block;width:100%;height:3px;border-radius:2px;background:hsl(var(--h) 42% 82%)}
.empty{padding:28px;text-align:center;color:var(--mut);font-size:13px}
/* 모바일: 일정 있는 날 + 오늘만 목록으로 */
.list{display:none;padding:4px 14px 14px}
.day{padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day h2{margin:0 0 6px;font-size:13px;font-weight:700}
.day.today h2{color:var(--accent)}
.day .ev{margin:6px 0 0;height:auto;min-height:30px;padding:6px 9px;white-space:normal}
.day .sp{font-weight:500;opacity:.75;margin-left:4px}
@media(max-width:700px){ body{padding:0} .card{border-radius:0} .cal{display:none} .list{display:block} }
/* 편집: 체크·추가·수정·삭제 */
.hr{display:flex;align-items:center;gap:8px}
.add{border:0;background:var(--accent);color:#fff;font:inherit;font-size:12px;font-weight:600;height:32px;padding:0 12px;border-radius:8px;cursor:pointer}
.ev{cursor:pointer}
.ev .o{cursor:pointer;background:none;padding:0;color:inherit}
.ev .o:hover{opacity:1}
.cell{position:relative}
.cell .plus{position:absolute;right:6px;top:6px;width:24px;height:24px;border:0;border-radius:7px;background:#EEF1F8;color:var(--mut);font-size:16px;line-height:1;cursor:pointer;opacity:0}
.cell:hover .plus{opacity:1}
.cell.out .plus{display:none}
.modal{position:fixed;inset:0;background:rgba(18,18,20,.32);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.box{background:#fff;border-radius:14px;width:100%;max-width:400px;padding:20px;box-shadow:0 24px 60px -20px rgba(20,22,28,.4)}
.box h3{margin:0 0 14px;font-size:15px}
.box label{display:block;margin-bottom:12px;font-size:12px;color:var(--mut)}
.box input[type=text],.box input[type=date],.box select{display:block;width:100%;margin-top:4px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
.box .row{display:flex;gap:10px}.box .row label{flex:1}
.box .chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.box .btns{display:flex;gap:8px;margin-top:6px}
.box .btns button{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.box .btns .save{background:var(--accent);border-color:var(--accent);color:#fff;margin-left:auto}
.box .btns .del{color:var(--sun)}
.box .err{color:var(--sun);font-size:12px;min-height:18px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1D1F26;color:#fff;font-size:13px;padding:9px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:11}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1 id="title"></h1>
    <div class="hr">
      <div class="nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <button id="now" class="today">오늘</button>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <button class="add" id="add">일정 추가</button>
    </div>
  </div>
  <div class="cal" id="cal"></div>
  <div class="list" id="list"></div>
</div>
<div class="modal" id="modal">
  <form class="box" id="form">
    <h3 id="mTitle">일정 추가</h3>
    <label>제목<input type="text" id="fTitle" maxlength="200" required /></label>
    <div class="row">
      <label>시작일<input type="date" id="fDate" required /></label>
      <label>종료일<input type="date" id="fEnd" /></label>
    </div>
    <label>구분<select id="fCat"></select></label>
    <label class="chk"><input type="checkbox" id="fDone" /> 완료</label>
    <div class="err" id="fErr"></div>
    <div class="btns">
      <button type="button" class="del" id="fDel">삭제</button>
      <button type="button" id="fCancel">취소</button>
      <button type="submit" class="save">저장</button>
    </div>
  </form>
</div>
<div class="modal" id="tModal">
  <div class="box">
    <h3 id="tTitle"></h3>
    <dl class="info" id="tInfo"></dl>
    <div class="btns"><button type="button" class="save" id="tClose">닫기</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const BRAND=(new URLSearchParams(location.search).get('brand')||'').toLowerCase();
const HUE={'EGC':262,'UGC':330,'온라인':200,'오프라인':122,'이벤트':18,'제품 업로드':160,'제품 입고':38,'업무':228};
const pad=n=>String(n).padStart(2,'0');
const kst=new Date(Date.now()+9*3600e3), TODAY=kst.toISOString().slice(0,10);
let ym=TODAY.slice(0,7), items=[], loaded=false, failed=false;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const endOf=e=>e.endDate||e.date;
const spans=(e,ds)=>e.date<=ds && endOf(e)>=ds;
const label=e=>(e.category?e.category+' · ':'')+e.title;
const pill=e=>e.kind==='task'
  ? `<div class="ev task ${e.done?'done':''}" style="--h:${HUE[e.category]??262}" title="${esc(label(e))}${e.owners?.length?' · '+esc(e.owners.join(', ')):''}" data-task="${e.id}"><span class="o"></span><span class="t">${esc(label(e))}</span>${e.owners?.length?`<span class="who">${esc(e.owners.join(', '))}</span>`:''}</div>`
  : `<div class="ev ${e.done?'done':''}" style="--h:${HUE[e.category]??262}" title="${esc(label(e))}" data-open="${e.id}"><button class="o" data-chk="${e.id}" aria-label="완료 표시" aria-pressed="${!!e.done}"></button><span class="t">${esc(label(e))}</span></div>`;
const md=ds=>`${Number(ds.slice(5,7))}월 ${Number(ds.slice(8))}일`;

function render(){
  const [y,m]=ym.split('-').map(Number);
  document.getElementById('title').textContent=`${y}년 ${m}월`;
  const dim=new Date(y,m,0).getDate(), lead=new Date(y,m-1,1).getDay();
  const mine=items.filter(e=>e.date<=`${ym}-31` && endOf(e)>=`${ym}-01`)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));

  /* PC: 달력. 기간 일정은 시작일에 카드, 이어지는 날엔 얇은 선 — 같은 줄에 쌓이도록 순서를 고정 */
  let h=['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow ${i===0?'sun':''}">${d}</div>`).join('');
  for(let i=0;i<lead;i++) h+=`<div class="cell out"><span class="d"></span></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${ym}-${pad(d)}`, dow=(lead+d-1)%7;
    const evs=mine.filter(e=>spans(e,ds));
    h+=`<div class="cell ${dow===0?'sun':''} ${ds<TODAY?'past':''} ${ds===TODAY?'today':''}"><span class="d">${d}</span><button class="plus" data-new="${ds}" aria-label="${d}일 일정 추가">+</button>${
      evs.map(e=>(e.date===ds||(d===1)||dow===0)?pill(e):`<div class="bar" style="--h:${HUE[e.category]??262}"></div>`).join('')}</div>`;
  }
  document.getElementById('cal').innerHTML=h;

  /* 모바일: 일정 있는 날 + 오늘 */
  let L='';
  for(let d=1;d<=dim;d++){
    const ds=`${ym}-${pad(d)}`, evs=mine.filter(e=>e.date===ds);
    if(!evs.length && ds!==TODAY) continue;
    const wd=['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
    L+=`<div class="day ${ds===TODAY?'today':''}"><h2>${md(ds)} ${wd}요일${ds===TODAY?' · 오늘':''}</h2>${
      evs.map(e=>pill(e).replace('</span></div>',`${e.endDate?`<span class="sp">~ ${md(e.endDate)}</span>`:''}</span></div>`)).join('')||'<div class="empty" style="padding:4px 0;text-align:left">일정 없음</div>'}</div>`;
  }
  if(!mine.length) L=`<div class="empty">${failed?'일정을 불러오지 못했습니다':loaded?'이번 달 일정이 없습니다':'불러오는 중…'}</div>`;
  document.getElementById('list').innerHTML=L;
}

async function load(){
  try{
    const r=await fetch('/api/schedule?brand='+encodeURIComponent(BRAND),{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    items=(await r.json()).items||[]; failed=false;
  }catch(e){ failed=!loaded; }
  loaded=true; render();
}

const shift=n=>{ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); };
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
document.getElementById('now').onclick=()=>{ ym=TODAY.slice(0,7); render(); };

/* ---------- 편집 (체크·추가·수정·삭제) ---------- */
const CATS=['피드','릴스','스레드','제품 업로드','제품 입고','공구','기획전','오프라인','EGC','온라인','이벤트','UGC'];
const $=id=>document.getElementById(id);
let editing=null, busy=false;

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }

async function save(payload){
  const r=await fetch('/api/schedule?brand='+encodeURIComponent(BRAND),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.message||'저장하지 못했습니다');
  return d;
}

$('fCat').innerHTML='<option value="">선택 안 함</option>'+CATS.map(c=>`<option>${c}</option>`).join('');
function openForm(e, date){
  editing=e||null;
  $('mTitle').textContent=e?'일정 수정':'일정 추가';
  $('fTitle').value=e?.title||''; $('fDate').value=e?.date||date||TODAY; $('fEnd').value=e?.endDate||'';
  $('fCat').value=e?.category||''; $('fDone').checked=!!e?.done; $('fErr').textContent='';
  $('fDel').style.display=e?'':'none';
  $('modal').classList.add('on'); setTimeout(()=>$('fTitle').focus(),0);
}
const closeForm=()=>{ $('modal').classList.remove('on'); editing=null; };

$('form').onsubmit=async ev=>{
  ev.preventDefault(); if(busy) return;
  const item={ title:$('fTitle').value.trim(), date:$('fDate').value, endDate:$('fEnd').value||null, category:$('fCat').value, done:$('fDone').checked };
  busy=true; $('fErr').textContent='';
  const was=editing;
  try{
    await save(was?{action:'update',id:was.id,item}:{action:'create',item});
    closeForm(); toast(was?'수정했습니다':'저장했습니다'); await load();
  }catch(e){ $('fErr').textContent=e.message; }
  busy=false;
};
$('fDel').onclick=async()=>{
  if(!editing || busy || !confirm('이 일정을 삭제할까요?')) return;
  busy=true;
  try{ await save({action:'delete',id:editing.id}); closeForm(); toast('삭제했습니다'); await load(); }
  catch(e){ $('fErr').textContent=e.message; }
  busy=false;
};
$('fCancel').onclick=closeForm;
$('modal').onclick=ev=>{ if(ev.target.id==='modal') closeForm(); };
$('add').onclick=()=>openForm(null, ym===TODAY.slice(0,7)?TODAY:`${ym}-01`);

/* 업무: 보기 전용 상세 (고치기는 운영 페이지에서) */
function openTask(e){
  $('tTitle').textContent=e.title;
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
  $('tInfo').innerHTML=row('기간', md(e.date)+(e.endDate?' ~ '+md(e.endDate):''))+row('상태', e.done?'완료':(e.status||'예정'))
    +row('담당자', (e.owners||[]).join(', '))+row('영역', e.area)+row('상세', e.memo);
  $('tModal').classList.add('on');
}
$('tClose').onclick=()=>$('tModal').classList.remove('on');
$('tModal').onclick=ev=>{ if(ev.target.id==='tModal') $('tModal').classList.remove('on'); };

document.addEventListener('click',async ev=>{
  const chk=ev.target.closest('[data-chk]');
  if(chk){
    ev.stopPropagation();
    const e=items.find(x=>x.id===chk.dataset.chk); if(!e) return;
    e.done=!e.done; render();
    try{ await save({action:'update',id:e.id,item:{done:e.done}}); await load(); }
    catch(err){ e.done=!e.done; render(); toast(err.message); }
    return;
  }
  const add=ev.target.closest('[data-new]'); if(add) return openForm(null, add.dataset.new);
  const task=ev.target.closest('[data-task]'); if(task){ const e=items.find(x=>x.id===task.dataset.task); if(e) openTask(e); return; }
  const open=ev.target.closest('[data-open]'); if(open){ const e=items.find(x=>x.id===open.dataset.open); if(e) openForm(e); }
});

render(); load();
/* 운영페이지에서 고친 내용이 열어둔 화면에도 바로 보이도록 30초마다, 그리고 탭으로 돌아올 때 새로 불러옴 */
setInterval(load,30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
