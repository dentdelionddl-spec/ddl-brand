  html body .calx .cell .ev{display:flex !important;align-items:center;gap:0;min-height:34px;padding:7px 10px 7px 8px !important;margin:0 0 6px !important;border:0 !important;border-radius:var(--r-md) !important;
    background:hsl(var(--h,214) 70% 95%) !important;box-shadow:0 0 0 1px hsl(var(--h,214) 50% 88%) inset;color:hsl(var(--h,214) 45% 28%) !important;font-size:13px !important;font-weight:600}
  html body .calx .cell .ev{flex-direction:column !important;align-items:flex-start !important;justify-content:center !important;text-align:left !important}
  html body .calx .cell .ev *{text-align:left !important}
  html body .calx .cell .ev .ev__m{color:hsl(var(--h,214) 20% 45%) !important}
  html body .calx .cell--today .cell__d{color:var(--accent) !important}
  html body .tabrow{padding:0 !important;margin-top:12px}
  html body .tabrow .tabs{gap:2px !important}
}

/* =========================================================
   모바일 전용 셸 (.m) — 엄지 기준: 터치 44px, 본문 15px, 좌우 16px
   ========================================================= */
.m{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.m svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mtop{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:56px;padding:0 12px 0 16px;
  background:rgba(236,237,239,.82);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line)}
.mtop__logo{height:17px;filter:brightness(0)}
.mtop__t{flex:1;min-width:0;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop__me{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 1px var(--line) inset;display:grid;place-items:center;font:700 12px var(--sans);color:var(--ink);padding:0}
.mtop__me svg{width:20px;height:20px}
.mico{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);padding:0;cursor:pointer}
.mico svg{width:22px;height:22px}
.mico:active{background:rgba(17,18,20,.06)}
.mmain{padding:12px 16px 0}
html body .m #view > .mv{margin:0 !important}
.mv{display:flex;flex-direction:column;gap:12px}
html body .m .mv > *{margin:0 !important}
.mrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.mrow::-webkit-scrollbar{display:none}
.mchipb{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border:0;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px var(--line) inset;font:600 14px var(--sans);color:var(--ink2);white-space:nowrap}
.mchipb span{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.mchipb[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.mchipb[aria-pressed="true"] span{color:rgba(255,255,255,.7)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mgrp{display:flex;align-items:baseline;gap:6px;margin:10px 4px 0;font-size:13px;color:var(--mut)}
.mgrp b{font-size:15px;color:var(--ink);font-weight:700}
.mt,.mc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:4px;min-height:64px;padding:8px 14px 8px 4px;border-radius:14px;
  background:rgba(255,255,255,.82);box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 1px 2px rgba(0,0,0,.04)}
.mc{background:hsl(var(--h) 70% 96% / .95);box-shadow:0 0 0 1px hsl(var(--h) 50% 88%) inset}
.mt__chk{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer}
.mt__chk svg{width:26px;height:26px;padding:5px;border-radius:50%;box-sizing:border-box;border:2px solid #C3C6CC;background:#fff;color:transparent;stroke-width:3}
.mc .mt__chk svg{border-color:hsl(var(--h) 35% 70%)}
.mt__chk[aria-pressed="true"] svg{background:var(--ink);border-color:var(--ink);color:#fff}
.mc .mt__chk[aria-pressed="true"] svg{background:hsl(var(--h) 45% 45%);border-color:hsl(var(--h) 45% 45%)}
.mt__b{min-width:0;padding:6px 0;cursor:pointer}
.mt__t{font-size:15px;font-weight:650;color:var(--ink);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc .mt__t{color:hsl(var(--h) 45% 26%)}
.mt__t em{font-style:normal;font-size:12px;font-weight:700;color:var(--alert);margin-right:6px}
.mt__m{font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .mt__m{color:hsl(var(--h) 15% 42%)}
.mt .st,.mc__tag{font-size:12px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.mc__tag{font-weight:650;background:hsl(var(--h) 60% 89%);color:hsl(var(--h) 45% 30%)}
.mt.is-done .mt__t,.mc.is-done .mt__t{color:var(--mut);text-decoration:line-through}
.mc.is-done{opacity:.6}
.mempty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:40px 16px;text-align:center;border-radius:14px;background:rgba(255,255,255,.55)}
.mempty b{font-size:15px}
.mempty span{font-size:13px;color:var(--mut);line-height:1.5}
.mcard{border-radius:16px;background:rgba(255,255,255,.82);box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 1px 2px rgba(0,0,0,.04)}
.mmonth{padding:8px 8px 10px}
.mmonth__hd{display:flex;align-items:center;justify-content:space-between;padding:0 0 4px}
.mmonth__hd b{font-size:16px;font-weight:700}
.mmonth__g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mmonth__g .w{font-size:12px;color:var(--mut);text-align:center;padding:6px 0}
.mmonth__g .w.is-sun{color:var(--alert)}
.mday{height:48px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:2px 0 0;font-family:var(--sans)}
.mday.is-out{pointer-events:none}
.mday .n{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.mday.is-sun .n{color:var(--alert)}
.mday.is-past .n{color:#A3A6AD}
.mday.is-today .n{color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.mday.is-sel .n{background:var(--accent);color:#fff;box-shadow:0 6px 14px -8px rgba(46,107,230,.9)}
.mday .dots{display:flex;gap:3px;height:5px}
.mday .dots i{width:5px;height:5px;border-radius:50%;background:hsl(var(--h) 62% 58%)}
.mday .dots i.is-done{opacity:.35}
.mday__hd{display:flex;align-items:baseline;gap:8px;margin:6px 4px 0}
.mday__hd b{font-size:17px;font-weight:700}
.mday__hd span{font-size:13px;color:var(--mut)}
.mb{position:relative;display:block;width:100%;text-align:left;border:0;padding:16px 44px 16px 16px;border-radius:16px;background:rgba(255,255,255,.82);box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 1px 2px rgba(0,0,0,.04);font-family:var(--sans);color:var(--ink)}
.mb__h{display:flex;align-items:baseline;gap:8px}
.mb__h b{font-size:16px;font-weight:700}
.mb__h span{font-size:13px;color:var(--mut)}
.mb__s{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--mut)}
.mb__s b{color:var(--ink);font-weight:700;margin-left:2px}
.mb__s b.is-bad{color:var(--alert)}
.mb i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.mb i svg{width:18px;height:18px}
.mmonthbar{display:flex;align-items:center;justify-content:space-between;border-radius:14px;background:rgba(255,255,255,.82);padding:0 4px}
.mmonthbar b{font-size:15px}
.mfab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;width:56px;height:56px;border:0;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 14px 28px -12px rgba(46,107,230,.9),0 2px 6px rgba(0,0,0,.12)}
.mfab svg{width:26px;height:26px;stroke-width:2.4}
.mnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:rgba(240,241,243,.86);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--line)}
.mnav__i{height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8E9198;font:600 11px var(--sans);border-radius:12px}
.mnav__i svg{width:24px;height:24px}
.mnav__i[aria-current="true"]{color:var(--ink)}
.mnav__i[aria-current="true"] svg{stroke-width:2.2}
/* 브랜드 상세·설정 안의 기존 화면: 모바일 셸 안에서 정리 */
.mlegacy > * + *{margin-top:12px}
.mlegacy .card{border-radius:16px !important}
.mlegacy .ttool .mine,.mlegacy .ttool [data-act="task-new"]{display:none}
.m .btn,.m .btn--sm{height:40px !important;font-size:13px !important}
html body .m .brow{display:flex !important;flex-wrap:nowrap !important;align-items:center;gap:8px;padding:10px 12px !important}
html body .m .brow .grip{display:none}
html body .m .brow .tk__t{flex:1 1 auto;min-width:0;width:auto !important}
html body .m .brow .tk__title,html body .m .brow .tk__meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html body .m .brow .btn{flex:0 0 auto;width:auto !important;padding:0 14px !important}
html body .m .card__hd{flex-wrap:nowrap !important}
@media(max-width:760px){ html body .modal .row2 > .f:has(.ochips){grid-column:1 / -1} }
/* 모바일 입력창: 아래에서 올라오는 시트, 칸 44px */
@media(max-width:760px){
  html body .ov{align-items:flex-end !important;padding:0 !important}
  html body .modal{width:100%;max-width:none;border-radius:20px 20px 0 0 !important;max-height:90vh;padding-bottom:env(safe-area-inset-bottom)}
  html body .modal__hd{padding:18px 16px 4px !important}
  html body .modal__bd{padding:12px 16px 4px !important}
  html body .modal__ft{padding:12px 16px !important}
  html body .modal .row2{grid-template-columns:1fr 1fr !important;gap:10px}
  html body .modal .f input:not([type=checkbox]),html body .modal .f select,html body .ochip span{height:44px !important;font-size:15px !important}
  html body .modal__ft .btn{height:44px !important;flex:1;font-size:15px !important}
  html body .modal__ft .spacer{display:none}
  html body .mclose{width:44px !important;height:44px !important}
  .picks{grid-template-columns:1fr}
  .pick{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;text-align:left}
  .pick__i{margin:0}
  .pick > span:last-child{margin-left:auto}
}

/* 모바일 필터: 상태는 한 줄 세그먼트, 브랜드·내 것만은 조용한 한 줄 */
.mseg{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(17,18,20,.06)}
.mseg button{flex:1 1 0;min-width:0;height:36px;border:0;border-radius:9px;background:transparent;font:600 13px var(--sans);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;padding:0 4px}
.mseg button i{font-style:normal;font-size:11px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.mseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mseg button[aria-pressed="true"] i{color:var(--ink2)}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 2px}
.mbar__t{font-size:13px;color:var(--mut)}
.msel{position:relative;display:inline-flex;align-items:center;min-width:0}
.msel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:650 15px var(--sans);color:var(--ink);padding:10px 22px 10px 2px;max-width:220px;text-overflow:ellipsis;cursor:pointer}
.msel::after{content:"";position:absolute;right:6px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:1.8px solid var(--ink2);border-bottom:1.8px solid var(--ink2);transform:rotate(45deg);pointer-events:none}
.mswitch{display:inline-flex;align-items:center;gap:8px;height:44px;border:0;background:transparent;font:600 13px var(--sans);color:var(--ink2);padding:0 2px}
.mswitch i{position:relative;width:40px;height:24px;border-radius:999px;background:rgba(17,18,20,.14);transition:background .15s}
.mswitch i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.mswitch[aria-pressed="true"]{color:var(--ink)}
.mswitch[aria-pressed="true"] i{background:var(--accent)}
.mswitch[aria-pressed="true"] i::after{transform:translateX(16px)}
.mv > .mseg + .mbar{margin-top:-4px !important}

/* 모바일: 화면 고정 — 확대·가로 흔들림·바운스 없음 */
@media(max-width:760px){
  html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y}
  .m{overflow-x:hidden;max-width:100vw}
  .m *{touch-action:manipulation}
  .mrow{touch-action:pan-x}
  /* iOS는 16px 미만 입력칸을 누르면 자동 확대 → 모든 입력 16px */
  input,select,textarea,html body .modal .f input:not([type=checkbox]),html body .modal .f select,html body .modal .f textarea,html body .msel select{font-size:16px !important}
}

/* 모바일 필터 줄: 브랜드 선택과 내 것만 스위치를 같은 36px 높이로 */
@media(max-width:760px){
  html body .mbar{min-height:36px;height:36px;padding:0 2px}
  html body .msel{height:36px}
  html body #view .msel select,html body .msel select{height:36px !important;min-height:36px !important;line-height:36px;padding:0 22px 0 2px !important;font-size:16px !important;font-weight:650;box-sizing:border-box}
  html body .mswitch{height:36px;gap:8px;font-size:13px}
  html body .mswitch i{width:36px;height:22px}
  html body .mswitch i::after{top:2px;left:2px;width:18px;height:18px}
  html body .mswitch[aria-pressed="true"] i::after{transform:translateX(14px)}
}

/* ===== 공통 드롭다운 (.dd) — PC·모바일 같은 모양 ===== */
.dd{display:inline-flex;align-items:center;gap:7px;height:var(--h,34px);padding:0 12px;border:0;border-radius:var(--r-sm);background:rgba(255,255,255,.6);box-shadow:0 0 0 1px var(--line) inset;
  font:600 13px/1 var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .12s,box-shadow .12s}
.dd:hover{background:#fff}
.dd[aria-expanded="true"]{background:#fff;box-shadow:0 0 0 1px var(--accent) inset,0 0 0 3px var(--accent-bg)}
.dd span{display:block;line-height:1}
.dd__c{flex:0 0 auto;width:10px;height:6px;fill:none;stroke:var(--ink2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.dd[aria-expanded="true"] .dd__c{transform:rotate(180deg)}
.dd--m{height:36px;padding:0 6px 0 2px;background:transparent;box-shadow:none;font-size:15px;font-weight:700;gap:6px}
.dd--m:hover,.dd--m[aria-expanded="true"]{background:transparent;box-shadow:none}
.dd--m .dd__c{width:10px;height:6px;stroke-width:1.8}
.ddpop{position:fixed;z-index:200;max-height:min(50vh,360px);overflow-y:auto;padding:6px;border-radius:12px;
  background:rgba(250,250,251,.92);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  box-shadow:0 0 0 1px rgba(17,18,20,.06),0 18px 40px -16px rgba(20,22,28,.35),0 2px 8px -2px rgba(20,22,28,.12);animation:ddIn .12s ease-out}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ddpop button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;
  font:500 13px var(--sans);color:var(--ink2);text-align:left;cursor:pointer}
.ddpop button:hover{background:rgba(17,18,20,.05);color:var(--ink)}
.ddpop button[aria-selected="true"]{color:var(--ink);font-weight:700}
.ddpop svg{width:14px;height:14px;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.ddpop button[aria-selected="true"] svg{visibility:visible}
@media(max-width:760px){.ddpop{padding:6px}.ddpop button{height:44px;font-size:15px;padding:0 12px}}

/* 모바일: 앱처럼 화면 고정 — 상단 바·하단 탭은 움직이지 않고 가운데만 스크롤 */
@media(max-width:760px){
  html:has(.m),body:has(.m){height:100%;overflow:hidden !important;position:fixed;inset:0;width:100%}
  .m{position:fixed;inset:0;display:flex;flex-direction:column;min-height:0;padding-bottom:0 !important;overflow:hidden}
  .m .mtop{position:relative;flex:0 0 auto;top:auto}
  .m .mmain{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px 96px}
  .m .mnav{position:relative;flex:0 0 auto;left:auto;right:auto;bottom:auto}
}

/* ===== 팝업 틀: 머리·바닥 고정, 가운데만 스크롤 (PC·모바일 공통) ===== */
html body .modal{display:flex !important;flex-direction:column;overflow:hidden !important;max-height:calc(100% - 48px)}
html body .modal__hd,html body .modal__ft{flex:0 0 auto;position:relative !important;z-index:2;background:rgba(247,247,248,.97) !important}
html body .modal__hd::after,html body .modal__ft::before{content:"";position:absolute;left:0;right:0;height:18px;pointer-events:none}
html body .modal__hd::after{top:100%;background:linear-gradient(rgba(247,247,248,.97),rgba(247,247,248,0))}
html body .modal__ft::before{bottom:100%;background:linear-gradient(rgba(247,247,248,0),rgba(247,247,248,.97))}
html body .modal__bd{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:14px !important;padding-bottom:18px !important}
html body .modal__ft{margin-top:0 !important}
@media(max-width:760px){
  html body .ov{position:fixed !important;left:0;right:0;top:0;height:100%;align-items:flex-end !important}
  html body .modal{max-height:calc(100% - 12px) !important;border-radius:20px 20px 0 0 !important}
  html body .modal__ft{padding-bottom:calc(12px + env(safe-area-inset-bottom)) !important}
  /* iOS 날짜칸이 옆으로 삐져나오지 않게 */
  html body .modal input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;width:100% !important;max-width:100%;text-align:left;line-height:44px}
  html body .modal input[type=date]::-webkit-date-and-time-value{text-align:left}
  html body .modal .row2 > *{min-width:0}
}

/* 모바일 상단 바·하단 탭: 거의 불투명 + 내용과 닿는 쪽에 부드러운 그라데이션 (PC 헤더와 같은 방식) */
@media(max-width:760px){
  html body .m .mtop{background:rgba(234,235,237,.97) !important;border-bottom:0 !important;z-index:5}
  html body .m .mtop::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;pointer-events:none;background:linear-gradient(rgba(234,235,237,.97),rgba(234,235,237,0))}
  html body .m .mnav{background:rgba(238,239,241,.97) !important;border-top:0 !important;z-index:5}
  html body .m .mnav::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:22px;pointer-events:none;background:linear-gradient(rgba(238,239,241,0),rgba(238,239,241,.97))}
  html body .m .mfab{z-index:6}

<script>
/* =========================================================
   DDL 브랜드 관리 — 단일 파일 앱
   저장: 로컬(localStorage) → 노션(Cloudflare Worker 경유) 선택 동기화
   ========================================================= */

const CONTENT_TYPES = ['EGC','UGC'];
const OPS_TYPES = ['온라인','오프라인','이벤트','제품 업로드','제품 입고'];
const TYPE_ALIAS = {'공구':'이벤트','기획전':'이벤트','피드':'EGC','릴스':'EGC','스레드':'EGC'};
const TYPES = [...CONTENT_TYPES, ...OPS_TYPES];
const TYPE_HUE = {'EGC':262,'UGC':330,'온라인':200,'오프라인':122,'이벤트':18,'제품 업로드':160,'제품 입고':38};
const catOf = t => CONTENT_TYPES.includes(t) ? '콘텐츠' : '운영';
/* 업무 영역은 고정값이 아니라 입력된 내용에서 자동 수집됩니다 */
function areasIn(bid){
  const count={};
  for(const t of DB.tasks){ const a=(t.area||'').trim(); if(!a) continue;
    if(bid && t.brandId!==bid) continue; count[a]=(count[a]||0)+1; }
  return Object.keys(count).sort((x,y)=>count[y]-count[x]||x.localeCompare(y,'ko'));
}
function allAreas(){ return areasIn(null); }
const PRIOS = ['긴급','높음','보통','낮음'];
const OWNERS = ['승호','산들','효정'];
const PSTATUS = ['기획','발주','생산중','입고','업로드','판매중','드랍'];
const WEEKS = ['1주차','2주차','3주차','4주차','5주차'];
const PLAN_KINDS = ['영상','이미지','텍스트'];
const REF_CATS = ['릴스','피드','스레드','계정','구분 필요'];
const COST_KINDS = ['원가','광고비','수수료','인건비','기타'];

const SEED_BRANDS = [
  {id:'ootn',     name:'OOTN',       ko:'오오티엔',   hue:40,  client:'', channels:['자사몰','무신사','플랫폼','기타']},
  {id:'aube',     name:'AUBE SEOUL', ko:'오브서울',   hue:340, client:'', channels:['자사몰','무신사','29CM','플랫폼','기타']},
  {id:'vivicate', name:'VIVICATE',   ko:'비비케이트', hue:262, client:'이케이아이엔티', channels:['자사몰','ZVZO','29CM','플랫폼','기타']},
  {id:'ruhel',    name:'RUHEL',      ko:'루엘',       hue:200, client:'', channels:['자사몰','해외','플랫폼','기타']},
  {id:'usuel',    name:'USUEL',      ko:'유주엘',     hue:170, client:'', channels:['콘텐츠 업로드 수']},
  {id:'factory',  name:'공장',       ko:'용저우 공장', hue:210, client:'', channels:['오더','샘플','기타']},
  {id:'ddl',      name:'DDL',        ko:'팀 디디엘',  hue:280, client:'', channels:['대행료','기타']}
];
/* 운영 종료한 브랜드 — 저장된 목록·노션 설정에서도 걸러냄 */
const REMOVED_BRANDS = ['fludk','arikiv','FLUD K','ARIKIV'];
const isRemovedBrand = b => REMOVED_BRANDS.includes(b.id) || REMOVED_BRANDS.includes(b.name);

/* ---------- storage (localStorage, 실패 시 메모리) ---------- */
const KEY='ddl-brand-commerce-v1';
const mem={};
const store={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

/* 노션 DB (프로젝트 DDL > 🗂 브랜드 관리 아래에 생성됨) */
const NOTION_DB={
  contents:'22c3381ad8e44f239be74fdd3243eba3',
  tasks:'1b390d2a35db48d796e26edaa0834a6a', /* 브랜드별 주간 플랜 > Weekly Plan */
  sales:'5ca27a6560214303bc77b2da9e48ce02',
  products:'ddd18f71b6c9475abc59f74881cff410',
  plans:'30a5544647d84123b4ad5e106c48c64e',
  costs:'e33ee267da7d43fd86f72c28fa888114',
  actions:'21f72c37590f48dba49455f0c705b4ab',
  config:'46b8ab2d1ddc47f7b5f8c0bfa4748ab9',
  refs:'ae4c78c3a8324090b2617774d9ae3f01',
  stats:'691bda8c1aec4253964f2adda0e18c05'
};
const NOTION_HUB='https://app.notion.com/p/3bd4f7cd6b86816cbc56ef161bf47379';
const PROXY_URL='https://ddl-brand.vercel.app/api/notion';

const blank = () => ({
  v:1,
  settings:{ workerUrl:PROXY_URL, db:{...NOTION_DB}, lastSync:null },
  brands: JSON.parse(JSON.stringify(SEED_BRANDS)),
  contents:[], tasks:[], sales:[], products:[], plans:[], costs:[], actions:[], refs:[], stats:[]
});

let DB;
try{ DB = JSON.parse(store.get(KEY)) || blank(); }catch(e){ DB = blank(); }
for(const k of ['contents','tasks','sales','products','plans','costs','actions','refs','stats']) if(!Array.isArray(DB[k])) DB[k]=[];
if(!DB.settings) DB.settings=blank().settings;
if(!DB.settings.db) DB.settings.db={...NOTION_DB};
if(DB.settings.dbv!==3){ DB.settings.db={...DB.settings.db, ...NOTION_DB}; DB.settings.dbv=3; }
for(const k in NOTION_DB) if(!DB.settings.db[k]) DB.settings.db[k]=NOTION_DB[k];
if(!DB.settings.workerUrl) DB.settings.workerUrl=PROXY_URL;
if(!DB.brands||!DB.brands.length) DB.brands=JSON.parse(JSON.stringify(SEED_BRANDS));
DB.brands=DB.brands.filter(b=>!isRemovedBrand(b));
/* 기기마다 따로 만들어진 동명 브랜드 합치기 */
for(const sb of SEED_BRANDS){
  const dup=DB.brands.filter(b=>b.name===sb.name && b.id!==sb.id);
  for(const d of dup){
    for(const k of ['contents','tasks','sales','products','plans','costs','actions'])
      (DB[k]||[]).forEach(r=>{ if(r.brandId===d.id){ r.brandId=sb.id; r.dirty=true; } });
    DB.brands=DB.brands.filter(b=>b!==d);
  }
}
/* 브랜드 순서는 설정에서 직접 정합니다 */
for(const k of ['plans','costs','actions']) if(!Array.isArray(DB[k])) DB[k]=[];
for(const c of DB.contents){ if(TYPE_ALIAS[c.type]){ c.type=TYPE_ALIAS[c.type]; c.dirty=true; } }
for(const pl of DB.plans){ if(!pl.kind){ pl.kind='영상'; pl.dirty=true; } }
for(const pl of DB.plans){ if(pl.asset==='필요 없음'){ pl.asset='텍스트만'; pl.dirty=true; } }
for(const k of ['contents','tasks','sales','products','plans','costs','actions','refs']){
  const seen=new Set();
  DB[k]=(DB[k]||[]).filter(r=>{ if(!r.notionId) return true; if(seen.has(r.notionId)) return false; seen.add(r.notionId); return true; });
}
for(const t of DB.tasks){ if(/\d+\s*월\s*\d+\s*주/.test(t.area||'')){ t.week=t.area; t.area=''; } }

const save=()=>{ store.set(KEY,JSON.stringify(DB)); if(typeof autoSync==='function') autoSync(); };

/* ---------- utils ---------- */
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR');
const man=n=>Math.round(Number(n||0)/10000).toLocaleString('ko-KR');
const pad=n=>String(n).padStart(2,'0');
const ymOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const dateStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date(); const TODAY=dateStr(today);
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const brandOf=id=>DB.brands.find(b=>b.id===id);
const hueBg=(h,l=45)=>`hsl(${h} 42% ${l}%)`;

function toast(msg,ms=2200){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),ms);
}

/* ---------- selectors ---------- */
const inMonth=(d,ym)=>String(d||'').slice(0,7)===ym;
const contentsOf=(bid,ym)=>DB.contents.filter(c=>c.brandId===bid&&inMonth(c.date,ym));
const spans=(r,ds)=>{ const a=r.date||r.start, b=r.end||a; return a && ds>=a && ds<=b; };
const contentsSpanning=(bid,ym)=>DB.contents.filter(c=>c.brandId===bid&&(inMonth(c.date,ym)||inMonth(c.end,ym)||(c.date&&c.end&&c.date<ym+'-01'&&c.end>ym+'-31')));
const tasksSpanning=(bid,ym)=>tasksOf(bid).filter(t=>inMonth(t.due,ym)||inMonth(t.start,ym));
const salesOf=(bid,ym)=>DB.sales.filter(s=>s.brandId===bid&&s.ym===ym);
const tasksOf=bid=>DB.tasks.filter(t=>t.brandId===bid);
const productsOf=bid=>DB.products.filter(p=>p.brandId===bid);
const plansOf=(bid,ym)=>DB.plans.filter(p=>p.brandId===bid&&p.ym===ym);
const costsOf=(bid,ym)=>DB.costs.filter(c=>c.brandId===bid&&c.ym===ym);
const costTotal=(bid,ym)=>costsOf(bid,ym).reduce((a,c)=>a+Number(c.amount||0),0);
const actionsOf=(bid,ym)=>DB.actions.filter(a=>a.brandId===bid&&a.ym===ym);
const taskById=id=>DB.tasks.find(t=>t.id===id);
function actionProgress(a){
  const ids=(a.taskIds||[]).map(taskById).filter(Boolean);
  if(Number(a.goal)>0) return { cur:Number(a.cur||0), goal:Number(a.goal), pct:Math.min(100,Number(a.cur||0)/Number(a.goal)*100), byTask:false };
  const done=ids.filter(t=>t.done).length;
  return { cur:done, goal:ids.length, pct: ids.length? done/ids.length*100 : 0, byTask:true };
}
function totals(bid,ym){
  const chs=brandOf(bid)?.channels||[];
  const rows=salesOf(bid,ym).filter(r=>!chs.length||chs.includes(r.channel));
  return { goal:rows.reduce((a,r)=>a+Number(r.goal||0),0), actual:rows.reduce((a,r)=>a+Number(r.actual||0),0) };
}
function paceRatio(ym){
  const [y,m]=ym.split('-').map(Number);
  const dim=new Date(y,m,0).getDate();
  if(ym===ymOf(today)) return today.getDate()/dim;
  return (new Date(y,m-1,1) < new Date(today.getFullYear(),today.getMonth(),1)) ? 1 : 0;
}
function ymShift(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return ymOf(d); }
function ymLabel(ym){ const [y,m]=ym.split('-'); return `${y}년 ${Number(m)}월`; }
function ymLabelShort(ym){ const [y,m]=ym.split('-'); return `${String(y).slice(2)}년 ${Number(m)}월`; }

/* 공유 링크 (?s=키): 한 브랜드만 보는 부분 미러링 — 같은 코드·같은 데이터라 대시보드를 고치면 그대로 반영 */
const SHARE_KEY=(new URLSearchParams(location.search).get('s')||'').trim();
const shareBrand=()=> SHARE_KEY ? (DB.brands.find(b=>b.shareKey===SHARE_KEY)||null) : null;
const EMBED=(()=>{ const q=new URLSearchParams(location.search); if(!q.get('embed')) return null;
  return { brand:(q.get('brand')||'').toLowerCase(), view:(q.get('view')||'calendar'), only:(q.get('only')||''), ro:!!q.get('readonly') }; })();
function applyEmbed(){
  if(!EMBED) return;
  const b=DB.brands.find(x=>x.id.toLowerCase()===EMBED.brand || (x.name||'').toLowerCase()===EMBED.brand);
  if(b) UI.brand=b.id;
  if(EMBED.view==='upload'){ UI.tab='plans'; UI.planTab='upload'; }
  else { UI.tab='calendar'; }
}
let __todayScrollKey="";
function scrollToToday(){
  if(window.innerWidth>760) return;
  if(UI.tab!=="calendar") { __todayScrollKey=""; return; }
  const key=UI.brand+"|"+UI.ym+"|"+UI.tab;
  if(__todayScrollKey===key) return;
  __todayScrollKey=key;
  const el=document.querySelector(".cell--today");
  if(!el) return;
  setTimeout(()=>{
    const t=document.querySelector(".cell--today");
    if(!t) return;
    const bar=document.querySelector(".topbar");
    const off=(bar?bar.offsetHeight:96)+10;
    const y=t.getBoundingClientRect().top + window.scrollY - off;
    window.scrollTo(0, Math.max(0,y));
  }, 120);
}
const WD_KO=["일","월","화","수","목","금","토"];
function mobileAgenda(){
  if(window.innerWidth>760) return;
  document.querySelectorAll("#view .cell[data-date]").forEach(c=>{
    const ds=c.dataset.date; if(!ds) return;
    const dt=new Date(ds+"T00:00:00");
    const d=c.querySelector(".cell__d"); if(!d) return;
    if(!d.querySelector(".cell__w")){
      const w=document.createElement("span");
      w.className="cell__w";
      w.textContent=WD_KO[dt.getDay()];
      d.appendChild(w);
    }
  });
}
const AG_PAL={
  "EGC":["#EAF1FF","#3B6FD4"],
  "UGC":["#F3ECFD","#7B4FD0"],
  "제품 입고":["#FFF4DF","#B07F26"],
  "이벤트":["#FDE9F0","#C4467C"],
  "온라인":["#E9F6EF","#2E8B62"],
  "오프라인":["#FFF0E8","#C2603A"]
};
function mobileAgenda2(){
  if(window.innerWidth>760) return;
  document.querySelectorAll("#view .ev").forEach(ev=>{
    if(ev.dataset.agenda) return;
    const span = ev.querySelector("span") || ev;
    const raw = (span.textContent||"").trim();
    let meta="", title=raw;
    const p = raw.split(" · ");
    if(p.length>1 && p[0].length<=8){ meta=p[0]; title=p.slice(1).join(" · "); }
    const pal = AG_PAL[meta] || (ev.classList.contains("ev--task") ? ["#F2F3F7","#6E7280"] : ["#EEF1F6","#5A6070"]);
    ev.dataset.agenda="1";
    ev.innerHTML = `<span class="ev__t">${esc(title)}</span>` + (meta?`<span class="ev__m">${esc(meta)}</span>`:"");
    ev.style.background = pal[0];
    ev.style.borderLeftColor = "transparent";
    const m = ev.querySelector(".ev__m"); if(m) m.style.color = pal[1];
  });
}
function mobileLayout(){
  if(window.innerWidth>760 || document.querySelector('.m')) return;
  const head=document.querySelector(".tophead");
  const mn=document.querySelector(".monthnav");
  if(head && mn && mn.parentElement!==head){ head.appendChild(mn); head.classList.add("tophead--m"); }
  const hd=document.querySelector("#view .card .card__hd");
  const ctrl=document.querySelector("#view > div");
  const prim=ctrl && ctrl.querySelector(".btn--primary");
  if(hd && prim && prim.parentElement!==hd){ hd.appendChild(prim); prim.classList.add("hd-action"); }
  /* 버튼 없는 빈 도구 줄만 숨김 (카드 묶음은 숨기지 않음) */
  if(ctrl && !ctrl.querySelector("button") && !ctrl.querySelector(".card")) ctrl.style.display="none";
  mobileAgenda();
  mobileAgenda2();
  scrollToToday();
}
function render(){
  if(SHARE_KEY){
    const sb=shareBrand();
    if(!sb){
      /* 노션에서 브랜드 목록을 확인하기 전에는 '없음' 대신 로딩만 보여줌 */
      $('#app').innerHTML = window.__shareChecked
        ? `<div class="sharewait"><img src="${LOGO_SRC}" alt="DDL"><b>링크를 찾을 수 없어요</b><span>공유가 해제됐거나 주소가 바뀌었을 수 있어요.</span></div>`
        : `<div class="sharewait"><img src="${LOGO_SRC}" alt="DDL"><i class="spin" aria-label="불러오는 중"></i></div>`;
      return;
    }
    UI.brand=sb.id; UI.mTab='brands'; UI.mBrand=sb.id; UI.mine=false;
    if(!['calendar','kpi','tasks','plans','sales','products'].includes(UI.tab)) UI.tab='calendar';
  }
  if(!EMBED && isMobile()) return renderMobile();
  const pv=document.getElementById('view'), pageKey=UI.brand+'|'+UI.tab;
  const keepTop = (pv && window.__pageKey===pageKey) ? pv.scrollTop : 0;
  window.__pageKey=pageKey;
  applyEmbed();
  if(EMBED&&EMBED.ro) document.body.classList.add('ro');
  if(UI.brand==='__all'||UI.brand==='__home') UI.brand=HOME_BRAND();
  const special = UI.brand==='__set' || UI.brand==='__home' || UI.brand==='__tasks' || UI.brand==='__sched';
  if(!special){ const b=brandOf(UI.brand)||DB.brands[0]; UI.brand=b?.id||'__set'; }
  $('#app').innerHTML= EMBED
  ? `<div class="app"><div class="main"><div class="view" id="view" style="padding:14px"></div></div></div>`
  : SHARE_KEY ? `<div class="app app--side app--share"><div class="main">${topbar()}<div class="view" id="view"></div></div></div>`
  : `
  <div class="app app--side">
    ${sideNav()}
    ${brandBar()}
    <div class="main">
      ${topbar()}
      <div class="view" id="view"></div>
    </div>
  </div>`;
  try{ $('#view').innerHTML = viewHtml(); $('#view').scrollTop=keepTop; }
  catch(e){ console.error(e); $('#view').innerHTML = '<div class="card"><div class="empty"><b>이 화면을 그리지 못했습니다</b>' + esc(String(e.message||e)) + '<br><br><button class="btn btn--sm" data-act="go-summary">요약으로 이동</button></div></div>'; }
  const bb=document.querySelector('.brandbar'), tb=document.querySelector('.topbar');
  if(bb && window.__barScroll) bb.scrollLeft=window.__barScroll;
  if(bb) bb.addEventListener('scroll',()=>{ window.__barScroll=bb.scrollLeft; });
  if(bb&&tb) tb.style.top=(bb.offsetParent?bb.offsetHeight:0)+'px';
  if(!window.__stickFix){ window.__stickFix=1; window.addEventListener('resize',()=>{ const b=document.querySelector('.brandbar'), t=document.querySelector('.topbar'); if(b&&t) t.style.top=(b.offsetParent?b.offsetHeight:0)+'px'; }); }
  headerGlass();
  bind();
}
/* 데스크톱 고정 헤더: 내용 시작 위치(--hh)를 헤더 높이에 맞추고, 스크롤하면 유리 효과 켜기 */
function headerGlass(){
  const main=document.querySelector('.app--side > .main'), v=document.getElementById('view'), tb=main&&main.querySelector('.topbar');
  if(!main||!v||!tb) return;
  const fit=()=>main.style.setProperty('--hh', tb.offsetHeight+'px');
  const mark=()=>main.classList.toggle('is-scrolled', v.scrollTop>2);
  fit(); mark();
  v.addEventListener('scroll', mark, {passive:true});
  if(!window.__hhFix){ window.__hhFix=1; window.addEventListener('resize',()=>{ const m=document.querySelector('.app--side > .main'), t=m&&m.querySelector('.topbar'); if(t) m.style.setProperty('--hh', t.offsetHeight+'px'); }); }
}

function sideNav(){
  const item=(attr,label,icon,on,meta='',neon=false)=>`<button class="snav__i" ${attr} aria-current="${on}">${icon||''}<span class="snav__l">${esc(label)}</span>${meta?`<span class="snav__m ${neon?'snav__m--n':''}">${esc(meta)}</span>`:''}</button>`;
  const s=DB.settings;
  const sync = !s.workerUrl ? '로컬 저장' : (s.auto===false ? '수동 동기화' : '노션 자동 동기화');
  return `<aside class="snav" aria-label="메뉴">
    <button class="snav__logo" data-act="home" title="홈으로"><img src="${LOGO_SRC}" alt="DDL" /></button>
    ${brandOf('ddl')&&!brandOf('ddl').hidden ? item('data-brand="ddl"','DDL',ICON.home,UI.brand==='ddl') : ''}
    ${item('data-brand="__tasks"','업무',ICON.check,UI.brand==='__tasks', String(DB.tasks.filter(t=>!t.done&&brandOf(t.brandId)&&!brandOf(t.brandId).hidden).length), true)}
    ${item('data-brand="__sched"','캘린더',ICON.cal,UI.brand==='__sched')}
    ${(()=>{
      const list=DB.brands.filter(br=>!br.hidden && br.id!=='ddl');
      const open = UI.navBrands!==false;
      return `<button class="snav__i snav__grp" data-act="nav-brands" aria-expanded="${open}">${ICON.tag}<span class="snav__l">브랜드</span>${ICON.chev}</button>
      <div class="snav__sub" ${open?'':'hidden'}>
      ${list.map(br=>{
        const {goal,actual}=totals(br.id,UI.ym);
        const meta = goal? Math.round(actual/goal*100)+'%' : '';
        return item(`data-brand="${br.id}"`, br.name, '', UI.brand===br.id, meta);
      }).join('')}
      </div>`;
    })()}
    <div class="snav__ft">
      ${item('data-act="me"', s.me?('나 · '+s.me):'담당자 선택', ICON.user, false)}
      ${item('data-brand="__set"','설정',ICON.gear,UI.brand==='__set')}
      <div class="snav__sync"><span class="snav__sd ${s.workerUrl&&s.auto!==false?'on':''}"></span>${esc(sync)}${s.lastSync?`<br><span>${esc(s.lastSync)}</span>`:''}</div>
    </div>
  </aside>`;

function brandBar(){
  const tab=(id,label,meta,color,on)=>`<button class="btab ${id==='__set'?'btab--util':''}" data-brand="${id}" aria-current="${on}"
      style="border-bottom-color:${on?color:'transparent'}">
      <span class="btab__n">${esc(label)}</span>${meta?`<span class="btab__p">${esc(meta)}</span>`:''}</button>`;
  /* 모바일 메뉴: 사이드바와 같은 순서 */
  const o=(v,l)=>`<option value="${v}" ${UI.brand===v?'selected':''}>${esc(l)}</option>`;
  const mobileSel = `<select class="brandsel" aria-label="메뉴" data-native>
    ${brandOf('ddl')&&!brandOf('ddl').hidden?o('ddl','DDL'):''}${o('__tasks','업무')}
    <optgroup label="브랜드">${o('__home','전체')}${DB.brands.filter(br=>!br.hidden&&br.id!=='ddl').map(br=>o(br.id,br.name)).join('')}</optgroup>
    ${o('__set','설정')}</select>`;
  return `<nav class="brandbar" aria-label="브랜드">
    ${mobileSel}
    <button class="blogo" data-act="home" title="홈으로"><img src="${LOGO_SRC}" alt="DDL" /><span>BRAND OPS</span></button>
    ${DB.brands.filter(br=>!br.hidden).map(br=>{
      const {goal,actual}=totals(br.id,UI.ym);
      const meta = goal? Math.round(actual/goal*100)+'%' : '—';
      return tab(br.id, br.name, meta, hueBg(br.hue,58), UI.brand===br.id);
    }).join('')}
    <button class="btab btab--me" data-act="me" title="내 이름 설정"><span class="btab__n">${DB.settings.me?esc(DB.settings.me):'담당자 선택'}</span></button>
    ${tab('__set','설정',DB.settings.workerUrl?(DB.settings.auto===false?'수동':'자동'):'로컬','#9AA0A9',UI.brand==='__set')}
  </nav>`;
}

function mineBtn(){
  const on=!!myFilter();
  return `<button class="mine" data-act="mine" aria-pressed="${on}">내 것만 보기</button>`;
}
function topbar(){
  if(UI.brand==='__set') return `<header class="topbar"><div class="tophead">
      <h1 class="brandtitle">설정 · 동기화</h1><div class="spacer"></div>
    </div></header>`;
  if(UI.brand==='__sched') return `<header class="topbar">
      <div class="tophead"><div><h1 class="brandtitle">캘린더<span class="brandko">전체 브랜드</span></h1></div><div class="spacer"></div>${monthNav()}</div>
    </header>`;
  if(UI.brand==='__tasks') return `<header class="topbar">
      <div class="tophead"><div><h1 class="brandtitle">업무<span class="brandko">전체 브랜드</span></h1></div><div class="spacer"></div></div>
    </header>`;
  if(UI.brand==='__home') return `<header class="topbar">
      <div class="tophead"><div><h1 class="brandtitle">전체 브랜드</h1></div><div class="spacer"></div>${monthNav()}</div>
    </header>`;

  const b=brandOf(UI.brand);
  const tabs=[['calendar','캘린더'],['kpi','KPI'],['tasks','업무'],['plans','콘텐츠'],['sales','매출·손익'],['products','제품']];
  return `<header class="topbar">
    <div class="tophead">
      <div>
        <h1 class="brandtitle">${esc(b.name)}${b.ko?`<span class="brandko">${esc(b.ko)}</span>`:''}</h1>
      </div>
      <div class="spacer"></div>
      ${SHARE_KEY?'':`<button class="btn btn--sm sharebtn" data-act="share" title="이 브랜드만 보는 공유 링크 복사">${ICON.share}공유</button>`}
      ${monthNav()}
    </div>
    <div class="tabrow">
      <div class="tabs" role="tablist">
        ${tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${UI.tab===k}">${l}</button>`).join('')}
      </div>
    </div>
  </header>`;
}
const monthNav=()=>`<div class="monthnav">
    <button data-mo="-1" aria-label="이전 달">‹</button>
    <span class="cur">${ymLabel(UI.ym)}</span>
    <button data-mo="1" aria-label="다음 달">›</button>
  </div>`;

function viewHtml(){
  if(UI.brand==='__home') return homeView();
  if(UI.brand==='__set') return settingsView();
  if(UI.brand==='__tasks') return taskBoard('');
  if(UI.brand==='__sched') return calendarView(true);
  switch(UI.tab){
    case 'calendar': return calendarView();
    case 'tasks': return taskBoard(UI.brand);
    case 'plans': return plansView();
    case 'kpi': return kpiView();
    case 'sales': return salesView();
    case 'products': return productsView();
    default: return calendarView();
  }
}

/* ---------- 요약 ---------- */
function todayUploads(bid){
  const list=(DB.contents||[]).filter(c=>{
    if(bid && c.brandId!==bid) return false;
    if(!CONTENT_TYPES.includes(c.type)) return false;
    return c.date===TODAY || (c.end && c.date<=TODAY && TODAY<=c.end);
  });
  return list.sort((x,y)=>Number(x.done)-Number(y.done)||(x.title||'').localeCompare(y.title||'','ko'));
}
function uploadCard(bid, showBrand){
  const list=todayUploads(bid);
  const done=list.filter(c=>c.done).length;
  return `<section class="card">
    <div class="card__hd"><h3>오늘 업로드 해야 할 콘텐츠</h3>
      <span class="eyebrow">${showBrand?'전 브랜드 ':''}${done}/${list.length}</span></div>
    <div class="card__bd">
      ${list.length? list.map(c=>`<div class="tk tk--click ${c.done?'tk--done':''}">
        <b data-toggle-content="${c.id}" title="업로드 완료" style="cursor:pointer;font-size:13px;line-height:1.3;padding-top:1px">${c.done?'✓':'□'}</b>
        <div class="tk__t" data-content="${c.id}" style="cursor:pointer">
          <div class="tk__title">${esc(c.title||'(제목 없음)')}</div>
          <div class="tk__meta">
            <span class="tag">${esc(c.type)}</span>
            ${showBrand?`<span class="tag">${esc(brandOf(c.brandId)?.name||'')}</span>`:''}
            ${c.end&&c.end!==c.date?`<span class="eyebrow">${c.date.slice(5)} ~ ${c.end.slice(5)}</span>`:''}
            ${c.done?'<span class="tag tag--ok">업로드 완료</span>':''}
          </div>
        </div>
      </div>`).join('')
      : `<div class="empty"><b>오늘 올릴 콘텐츠가 없습니다</b>캘린더에서 콘텐츠를 등록하면 그날 여기에 나와요.</div>`}
    </div>
  </section>`;
}
function homeView(){
  const ym=UI.ym;
  const brands=DB.brands.filter(b=>!b.hidden && !['factory','ddl'].includes(b.id));
  const pacePct=Math.round(paceRatio(ym)*100);
  const sum=brands.reduce((a,b)=>{ const t=totals(b.id,ym); return {goal:a.goal+t.goal, actual:a.actual+t.actual}; },{goal:0,actual:0});

  const who='';
  const owners=OWNERS;
  const openAll=DB.tasks.filter(t=>!t.done && hasOwner(t,who));
  const todayTasks=openAll.filter(t=>t.due===TODAY || (t.start&&t.due&&t.start<=TODAY&&TODAY<=t.due))
    .sort((x,y)=>PRIOS.indexOf(x.priority)-PRIOS.indexOf(y.priority));
  const overdue=openAll.filter(t=>t.due&&t.due<TODAY).sort((x,y)=>x.due.localeCompare(y.due));

  const cs=DB.contents.filter(c=>inMonth(c.date,ym));
  const cCount=t=>cs.filter(c=>c.type===t).length;

  return `

  <div class="grid g2">
    <section class="card">
      <div class="card__hd"><h3>오늘 해야 할 업무</h3><span class="eyebrow">전 브랜드 ${todayTasks.length}건</span></div>
      <div class="card__bd">
        ${todayTasks.length? todayTasks.map(t=>taskRow(t,true,true)).join('')
          : `<div class="empty"><b>오늘 마감인 업무가 없습니다</b>브랜드별 업무 탭에서 마감일을 넣으면 그날 여기에 모여요.</div>`}
      </div>
    </section>
    <section class="card">
      <div class="card__hd"><h3>지난 업무</h3>
        ${overdue.length?`<span class="tag tag--urgent">${overdue.length}건 지연</span>`:'<span class="eyebrow">없음</span>'}</div>
      <div class="card__bd">
        ${overdue.length? overdue.map(t=>taskRow(t,true,true)).join('')
          : `<div class="empty"><b>지연된 업무가 없습니다</b>마감일이 지난 미완료 업무가 여기에 모입니다.</div>`}
      </div>
    </section>
  </div>

  ${uploadCard(null,true)}

  <section class="card" style="margin-top:14px">
    <div class="card__hd"><h3>콘텐츠 운영 현황</h3><span class="eyebrow" style="margin-left:auto">전 브랜드 · ${ymLabel(ym)}</span></div>
    <div class="card__bd">
      <div class="types" style="grid-template-columns:repeat(2,1fr)">
        ${CONTENT_TYPES.map(t=>`<div class="type ${cCount(t)===0?'type--zero':''}">
          <div class="type__n">${cCount(t)}</div><div class="type__l">${t}</div></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card__hd"><h3>브랜드별 목표 대비 실적</h3>
      <span class="mono" style="font-size:12px;color:var(--mut)">합계 ${man(sum.actual)} / ${man(sum.goal)}만 · ${sum.goal?Math.round(sum.actual/sum.goal*100):0}%</span>
      <span class="tag ${sum.goal&&sum.actual/sum.goal*100>=pacePct?'tag--ok':'tag--high'}" style="margin-left:auto">진도 ${pacePct}%</span></div>
    <div class="card__bd">
      <div class="bgrid">
        ${brands.map(b=>{
          const t=totals(b.id,ym); const pct=t.goal? t.actual/t.goal*100:0;
          const behind=pct<pacePct-5;
          return `<button class="bcell" data-gobrand="${b.id}">
            <div class="bcell__h"><b>${esc(b.name)}</b><span class="mono">${Math.round(pct)}%</span></div>
            <div class="mono bcell__v">${man(t.actual)} <span>/ ${man(t.goal)}만</span></div>
            <div class="track"><i style="width:${Math.min(100,pct)}%;background:${behind?'#C9A0A8':hueBg(b.hue,58)}"></i>
              <span class="pace" style="left:${Math.min(100,pacePct)}%"></span></div>
          </button>`;
        }).join('')}
      </div>
    </div>
  </section>
`;
}

/* ---------- 캘린더 ---------- */
function calendarView(all){
  /* all = 스케줄 (보이는 모든 브랜드, 브랜드 필터 가능) */
  const sb = all && UI.schedBrand && brandOf(UI.schedBrand) ? UI.schedBrand : '';
  const bids = all ? (sb ? [sb] : DB.brands.filter(x=>!x.hidden).map(x=>x.id)) : [brandOf(UI.brand).id];
  const b = all ? null : brandOf(UI.brand), ym=UI.ym;
  const bn = r => { if(!(all&&!sb)) return ''; const nm=brandOf(r.brandId)?.name||''; return `<em class="evb" title="${esc(nm)}">${esc(nm.split(' ')[0])}</em>`; };
  const [y,m]=ym.split('-').map(Number);
  const first=new Date(y,m-1,1), dim=new Date(y,m,0).getDate(), lead=first.getDay();
  const onlyContent = EMBED && EMBED.only==='content';
  const noTasks = EMBED && (EMBED.only==='content' || EMBED.only==='plan');
  const cs=bids.flatMap(id=>contentsSpanning(id,ym)).filter(c=>!onlyContent || CONTENT_TYPES.includes(c.type));
  const calWho=EMBED? '' : (myFilter());
  const allDayTasks=bids.flatMap(id=>tasksSpanning(id,ym));
  const dayTasks=noTasks? [] : allDayTasks.filter(t=>hasOwner(t,calWho));
  const calOwners=OWNERS;
  const cells=[];
  for(let i=0;i<lead;i++) cells.push(`<div class="cell cell--out"></div>`);
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(m)}-${pad(d)}`;
    /* 기간 일정은 위에 같은 순서로 쌓아 날짜끼리 한 줄로 이어지게 */
    const multi=(a,b)=>a&&b&&a!==b;
    const ord=(a0,a1,b0,b1,ia,ib)=>(Number(!multi(b0,b1))-Number(!multi(a0,a1)))*-1 || String(a0).localeCompare(String(b0)) || String(ia).localeCompare(String(ib));
    const evs=cs.filter(c=>spans(c,ds)).sort((a,b)=>ord(a.date,a.end,b.date,b.end,a.id,b.id));
    const dow=new Date(y,m-1,d).getDay();
    const tks=dayTasks.filter(t=>spans({date:t.start||t.due,end:t.due},ds)).sort((a,b)=>ord(a.start,a.due,b.start,b.due,a.id,b.id));
    const pos=(a,b)=>!multi(a,b)?'':(ds===a?'ev--start':ds===b?'ev--end':'ev--mid');
    cells.push(`<div class="cell ${ds===TODAY?'cell--today':''} ${ds<TODAY?'cell--past':''}" data-date="${ds}">
      <div class="cell__d ${dow===0?'cell__sun':''}"><span class="cn">${d}</span></div>
      ${evs.map(e=>`<span class="ev ${e.done?'ev--done':''} ${pos(e.date,e.end)}" draggable="true" data-drag="c:${e.id}" style="--h:${TYPE_HUE[e.type]??262};border-left-color:${hueBg(TYPE_HUE[e.type]||0,55)}"><b class="evchk" data-toggle-content="${e.id}" title="완료 표시" aria-pressed="${!!e.done}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg></b><span data-content="${e.id}" style="cursor:pointer">${bn(e)}${(e.att&&e.att.length)||(e.attView&&e.attView.length)?'📎':''}${esc(e.type)} · ${esc(e.title||'')}</span></span>`).join('')}
      ${tks.map(t=>`<span class="ev ev--task ${t.done?'ev--done':''} ${pos(t.start,t.due)}" draggable="true" data-drag="t:${t.id}" style="--h:214"><b class="evchk" data-toggle-task-btn="${t.id}" title="완료 표시" aria-pressed="${!!t.done}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg></b><span data-edit-task="${t.id}" style="cursor:pointer">${bn(t)}${esc(t.title)}</span></span>`).join('')}
      <button class="cell__add" data-newdate="${ds}" aria-label="${d}일 추가">+</button>
    </div>`);
  }
  while(cells.length%7) cells.push(`<div class="cell cell--out"></div>`);

  const chip=(label,val,on)=>`<button class="btn btn--sm" data-taskowner="${esc(val)}" style="border-radius:999px;${on?'background:var(--ink);border-color:var(--ink);color:#fff':''}">${esc(label)}</button>`;
  if(EMBED) return `<section class="card">
    <div class="card__hd"><h3>${ymLabel(ym)} 캘린더</h3><div style="margin-left:auto">${monthNav()}</div></div>
    <div class="calwrap"><div class="cal">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal__dow">${d}</div>`).join('')}
      ${cells.join('')}
    </div></div>
  </section>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      ${all? dd('schedBrand',sb,[['','모든 브랜드'],...DB.brands.filter(x=>!x.hidden).map(x=>[x.id,x.name])],'dd--m') : ''}
      <div class="spacer" style="flex:1"></div>
      ${EMBED?'':mineBtn()}
      <button class="btn btn--sm btn--primary" data-newdate="${ym}-${pad(Math.min(today.getDate(),dim))}">항목 추가</button>
    </div>
  <section class="card calx">
    <div class="card__hd"><h3><span class="hd-long">${ymLabel(ym)}</span><span class="hd-short">${ymLabelShort(ym)}</span></h3>
      <span class="eyebrow" style="margin-left:auto">${calWho?esc(calWho)+'님 업무만':'카드를 끌어 다른 날로 옮길 수 있어요'}</span></div>
    <div class="calwrap"><div class="cal">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal__dow">${d}</div>`).join('')}
      ${cells.join('')}
    </div></div>
  </section>`;
}

/* ---------- 업무 ---------- */
function ownersOf(t){ return (Array.isArray(t.owners)&&t.owners.length)? t.owners : (t.owner? [t.owner] : []); }
function ownerFilter(w){ return OWNERS.includes(w)? w : ''; }
/* 기본은 전체, '내 것만 보기' 켜면 설정된 내 이름만 */
function myFilter(){ const me=DB.settings.me||''; return (me && UI.mine===true)? me : ''; }
function hasOwner(t,who){ return !who || ownersOf(t).includes(who); }
function ownerPicker(sel){
  const names=OWNERS;
  return `<div class="f"><span>담당 (여러 명 선택 가능)</span>
    <div id="t_owners" class="ochips">
      ${names.map(n=>`<label class="ochip"><input type="checkbox" class="ownchk" value="${esc(n)}" ${ (sel||[]).includes(n)?'checked':'' } /><span>${esc(n)}</span></label>`).join('')}
    </div></div>`;
}
function readOwners(){ return [...document.querySelectorAll('.ownchk:checked')].map(el=>el.value); }
function taskRow(t,compact,showBrand){
  const st=taskState(t), b=brandOf(t.brandId), ow=ownersOf(t);
  const meta=[showBrand&&b?b.name:'', ow.length>2?ow.slice(0,2).join(', ')+' 외 '+(ow.length-2):ow.join(', '), t.area||''].filter(Boolean).map(esc).join(' · ');
  return `<div class="trw ${t.done?'is-done':''}" data-edit-task="${t.id}">
    <input type="checkbox" data-toggle-task="${t.id}" ${t.done?'checked':''} onclick="event.stopPropagation()" aria-label="완료 표시" />
    <div class="trw__m"><div class="tt">${t.priority==='긴급'?'<span class="pr">긴급</span>':''}${esc(t.title)}</div>${meta?`<div class="ta">${meta}</div>`:''}</div>
    <div class="trw__d">${t.due?t.due.slice(5).replace('-','/'):''}</div>
    <span class="st ${st.cls}">${st.l}</span>
  </div>`;
}

function autoWeek(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-').map(Number);
  return `${m}월 ${Math.ceil(d/7)}주차`;
}
function weekKey(w){
  const m=/(\d+)\s*월\s*(\d+)\s*주/.exec(w||''); 
  return m? (Number(m[1])*10+Number(m[2])) : 999;
}
function tasksView(){
  const b=brandOf(UI.brand);
  const all=tasksOf(b.id);
  const owners=OWNERS;
  const me=DB.settings.me||'';
  const who=myFilter();
  const scoped = who? all.filter(t=>hasOwner(t,who)) : all;
  /* 완료는 상단에서 고른 달에 마감된 것만 */
  const open=scoped.filter(t=>!t.done), done=scoped.filter(t=>t.done&&(t.due||'').startsWith(UI.ym));
  const showDone = UI.taskDone===true;
  const list = showDone? done : open;
  const sorter=(x,y)=>(x.due||'9999').localeCompare(y.due||'9999')||PRIOS.indexOf(x.priority)-PRIOS.indexOf(y.priority);
  const areaOf=t=>(t.area||'').trim()||'미분류';
  const areas=[...new Set(list.map(areaOf))].sort((x,y)=>{
    const first=a=>list.filter(t=>areaOf(t)===a).map(t=>t.due||'9999-99-99').sort()[0]||'9999-99-99';
    return first(x).localeCompare(first(y)) || x.localeCompare(y,'ko');
  });
  const pct = (open.length+done.length)? Math.round(done.length/(open.length+done.length)*100):0;
  const chip=(label,val,on)=>`<button class="btn btn--sm" data-taskowner="${esc(val)}" style="border-radius:999px;${on?'background:var(--ink);border-color:var(--ink);color:#fff':''}">${esc(label)}</button>`;
  return `<div class="ttool">
      <div class="tabs">
        <button class="tab" data-taskview="todo" aria-selected="${!showDone}">할 일 ${open.length}</button>
        <button class="tab" data-taskview="done" aria-selected="${showDone}">${Number(UI.ym.slice(5))}월 완료 ${done.length}</button>
      </div>
      <span class="tprog"><span>진행률 ${pct}%</span><span class="track"><i style="width:${pct}%"></i></span></span>
      <div class="spacer" style="flex:1"></div>
      ${mineBtn()}
      <button class="btn btn--primary btn--sm" data-act="task-new">업무 추가</button>
    </div>
    ${!list.length? `<div class="card"><div class="empty"><b>${showDone?'완료한 업무가 없습니다':'할 일이 없습니다'}</b>${who?`담당 ${esc(who)} 기준입니다.`:'업무를 추가하거나 노션 주간 플랜에서 내려받으세요.'}</div></div>`
    : `<section class="card tlist">${areas.map(a=>{
      const rows=list.filter(t=>areaOf(t)===a).sort((x,y)=>(x.due||'9999-99-99').localeCompare(y.due||'9999-99-99')||PRIOS.indexOf(x.priority)-PRIOS.indexOf(y.priority));
      return `<div class="tlist__g"><b>${esc(a)}</b><span>${rows.length}</span></div>
        ${rows.map(t=>taskRow(t,true)).join('')}`;
    }).join('')}</section>`}`;
}


/* =========================================================
   모바일 전용 화면 (760px 이하) — PC 화면을 줄이지 않고 따로 그린다
   하단 탭: 업무 · 캘린더 · 브랜드 · 설정 / 터치 크기 44px 이상
   ========================================================= */
const isMobile=()=>window.matchMedia('(max-width:760px)').matches;
/* 폰 키보드가 올라오면 시트가 키보드 위 보이는 영역 안에 들어오도록 */
function fitSheet(){
  const ov=document.querySelector('#layer .ov'); if(!ov) return;
  if(!isMobile()||!window.visualViewport){ ov.style.height=''; ov.style.top=''; return; }
  const vv=window.visualViewport; ov.style.top=vv.offsetTop+'px'; ov.style.height=vv.height+'px'; ov.style.bottom='auto';
}
if(window.visualViewport && !window.__vvFix){ window.__vvFix=1; ['resize','scroll'].forEach(t=>window.visualViewport.addEventListener(t,fitSheet)); }
if(!window.__noZoom){ window.__noZoom=1;
  const block=e=>{ if(isMobile()) e.preventDefault(); };
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,block,{passive:false}));
  document.addEventListener('touchmove',e=>{ if(isMobile() && e.touches && e.touches.length>1) e.preventDefault(); },{passive:false});
  let lastTap=0;
  document.addEventListener('touchend',e=>{ if(!isMobile()) return; const now=Date.now(); if(now-lastTap<300 && !e.target.closest('input,textarea,select')) e.preventDefault(); lastTap=now; },{passive:false});
}
/* PC ↔ 모바일 화면 연동: 창 크기가 바뀌어도 보던 화면 그대로 */
function toMobileState(){
  const b=UI.brand;
  if(b==='__tasks'){ UI.mTab='tasks'; }
  else if(b==='__sched'){ UI.mTab='cal'; }
  else if(b==='__set'){ UI.mTab='set'; }
  else if(brandOf(b)){
    UI.mTab='brands'; UI.mBrand=b;
  }
}
function toDesktopState(){
  const t=UI.mTab||'tasks';
  if(t==='tasks') UI.brand='__tasks';
  else if(t==='cal') UI.brand='__sched';
  else if(t==='set') UI.brand='__set';
  else if(t==='brands'){ if(UI.mBrand&&brandOf(UI.mBrand)){ UI.brand=UI.mBrand; } else { UI.brand=HOME_BRAND(); UI.tab='calendar'; } }
}
if(!window.__mqFix){ window.__mqFix=1; window.matchMedia('(max-width:760px)').addEventListener('change',e=>{ e.matches? toMobileState() : toDesktopState(); ddClose&&ddClose(); saveUI(); render(); }); }
const MI={
  tasks:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',

  brands:'<svg viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>',
  set:'<svg viewBox="0 0 24 24"><path d="M10.33 4.32c.43-1.76 2.92-1.76 3.35 0a1.72 1.72 0 0 0 2.57 1.07c1.54-.94 3.31.83 2.37 2.37a1.72 1.72 0 0 0 1.07 2.57c1.76.43 1.76 2.92 0 3.35a1.72 1.72 0 0 0-1.07 2.57c.94 1.54-.83 3.31-2.37 2.37a1.72 1.72 0 0 0-2.57 1.07c-.43 1.76-2.92 1.76-3.35 0a1.72 1.72 0 0 0-2.57-1.07c-1.54.94-3.31-.83-2.37-2.37a1.72 1.72 0 0 0-1.07-2.57c-1.76-.43-1.76-2.92 0-3.35a1.72 1.72 0 0 0 1.07-2.57c-.94-1.54.83-3.31 2.37-2.37 1 .61 2.3.07 2.57-1.07z"/><circle cx="12" cy="12" r="3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  chk:'<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>'
};
const mLiveBrands=()=>DB.brands.filter(b=>!b.hidden);
const mSeg=(items,cur,attr)=>`<div class="mseg">${items.map(([k,l,n])=>`<button ${attr}="${k}" aria-pressed="${cur===k}">${esc(l)}${n?`<i>${n}</i>`:''}</button>`).join('')}</div>`;
const mBrandSel=(id,cur,ids)=>dd(id,cur,[['','모든 브랜드'],...mLiveBrands().filter(b=>!ids||ids.has(b.id)).map(b=>[b.id,b.name])],'dd--m');
const mMine=()=>`<button class="mswitch" data-act="mine" aria-pressed="${!!myFilter()}"><span>내 것만</span><i></i></button>`;
const mChip=(attr,label,on,n)=>`<button class="mchipb" ${attr} aria-pressed="${!!on}">${esc(label)}${n!==undefined?`<span>${n}</span>`:''}</button>`;
function mTaskCard(t,showBrand=true){
  const st=taskState(t), b=brandOf(t.brandId), ow=ownersOf(t);
  const meta=[showBrand&&b?b.name:'', ow.length>2?ow.slice(0,2).join(', ')+' 외 '+(ow.length-2):ow.join(', '), t.area||''].filter(Boolean).map(esc).join(' · ');
  return `<div class="mt ${t.done?'is-done':''}">
    <button class="mt__chk" data-toggle-task-btn="${t.id}" aria-label="완료 표시" aria-pressed="${!!t.done}">${MI.chk}</button>
    <div class="mt__b" data-edit-task="${t.id}">
      <div class="mt__t">${t.priority==='긴급'?'<em>긴급</em>':''}${esc(t.title)}</div>
      ${meta?`<div class="mt__m">${meta}</div>`:''}
    </div>
    <span class="st ${st.cls}">${st.l}</span>
  </div>`;
}
function mTasksView(){
  const live=DB.tasks.filter(t=>{ const b=brandOf(t.brandId); return b&&!b.hidden; });
  const bf=UI.taskBrand&&brandOf(UI.taskBrand)?UI.taskBrand:'';
  const who=myFilter();
  const sc=live.filter(t=>(!bf||t.brandId===bf)&&(!who||hasOwner(t,who)));
  const open=sc.filter(t=>!t.done), ym=TODAY.slice(0,7);
  const [,wk1]=weekRange();
  const G={
    late: open.filter(t=>t.due&&t.due<TODAY),
    today: open.filter(t=>t.due===TODAY),
    week: open.filter(t=>t.due&&t.due>TODAY&&t.due<=wk1),
    all: open,
    done: sc.filter(t=>t.done&&(t.due||'').startsWith(ym))
  };
  const f=UI.mFilter&&UI.mFilter!=='today'&&G[UI.mFilter]?UI.mFilter:'all';
  const byDue=(x,y)=>(x.due||'9999-99-99').localeCompare(y.due||'9999-99-99')||PRIOS.indexOf(x.priority)-PRIOS.indexOf(y.priority);
  let body;
  if(f==='all'){
    const groups=[['지연',G.late],['오늘',G.today],['이번 주',G.week],['이후',open.filter(t=>t.due&&t.due>wk1)],['마감 없음',open.filter(t=>!t.due)]].filter(([,r])=>r.length);
    body=groups.map(([k,r])=>`<div class="mgrp"><b>${k}</b><span>${r.length}</span></div>${r.sort(byDue).map(t=>mTaskCard(t)).join('')}`).join('');
  } else {
    const r=G[f].slice().sort(f==='done'?(x,y)=>(y.due||'').localeCompare(x.due||''):byDue);
    body=r.map(t=>mTaskCard(t)).join('');
  }
  const me=DB.settings.me||'';
  return `<section class="mv">
    ${mSeg([['all','전체',G.all.length],['late','지연',G.late.length],['week','이번 주',G.week.length],['done',Number(ym.slice(5))+'월 완료',G.done.length]],f,'data-mfilter')}
    <div class="mbar">${mBrandSel('mBrand',bf,new Set(live.map(t=>t.brandId)))}${mMine()}</div>
    <div class="mlist">${body || `<div class="mempty"><b>${f==='done'?'이번 달 완료한 업무가 없어요':'할 일이 없어요'}</b><span>오른쪽 아래 + 로 업무를 추가하세요</span></div>`}</div>
  </section>`;
}
function mCalView(forceBid){
  const ym=UI.ym, [y,m]=ym.split('-').map(Number);
  const first=new Date(y,m-1,1), dim=new Date(y,m,0).getDate(), lead=first.getDay();
  const bf=forceBid || (UI.schedBrand&&brandOf(UI.schedBrand)?UI.schedBrand:'');
  const live=new Set(mLiveBrands().map(b=>b.id));
  const inB=r=>live.has(r.brandId)&&(!bf||r.brandId===bf);
  const cs=(DB.contents||[]).filter(c=>inB(c));
  const who=myFilter();
  const ts=DB.tasks.filter(t=>inB(t)&&(!who||hasOwner(t,who)));
  const itemsOn=ds=>[...cs.filter(c=>spans(c,ds)).map(c=>({k:'c',o:c})), ...ts.filter(t=>spans({date:t.start||t.due,end:t.due},ds)).map(t=>({k:'t',o:t}))];
  const hueOf=it=>it.k==='c'?(TYPE_HUE[it.o.type]??262):214;
  const sel=(UI.mCalSel&&UI.mCalSel.slice(0,7)===ym)?UI.mCalSel:(TODAY.slice(0,7)===ym?TODAY:`${ym}-01`);
  const open=UI.mCalOpen===true;
  const dayBtn=ds=>{ const its=itemsOn(ds), dt=new Date(ds+'T00:00:00');
    return `<button class="mday ${ds===sel?'is-sel':''} ${ds===TODAY?'is-today':''} ${dt.getDay()===0?'is-sun':''}" data-msel="${ds}"><span class="n">${dt.getDate()}</span><span class="dots">${its.slice(0,3).map(it=>`<i style="--h:${hueOf(it)}" class="${it.o.done?'is-done':''}"></i>`).join('')}</span></button>`; };
  /* 접힌 상태: 선택한 날이 있는 한 주만 */
  const ws=new Date(sel+'T00:00:00'); ws.setDate(ws.getDate()-ws.getDay());
  const week=[...Array(7)].map((_,k)=>{ const d=new Date(ws); d.setDate(ws.getDate()+k); return dateStr(d); });
  const days=[];
  for(let i=0;i<lead;i++) days.push('<span class="mday is-out"></span>');
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(m)}-${pad(d)}`, its=itemsOn(ds), dow=new Date(y,m-1,d).getDay();
    days.push(`<button class="mday ${ds===sel?'is-sel':''} ${ds===TODAY?'is-today':''} ${dow===0?'is-sun':''} ${ds<TODAY?'is-past':''}" data-msel="${ds}">
      <span class="n">${d}</span><span class="dots">${its.slice(0,3).map(it=>`<i style="--h:${hueOf(it)}" class="${it.o.done?'is-done':''}"></i>`).join('')}</span></button>`);
  }

function ddMenu(btn,opts,cur,onPick){
  ddClose(); btn.setAttribute('aria-expanded','true');
  const r=btn.getBoundingClientRect(), pop=document.createElement('div');
  pop.className='ddpop'; pop.setAttribute('role','listbox');
  pop.innerHTML=opts.map(([v,l])=>`<button role="option" data-v="${esc(v)}" aria-selected="${v===cur}"><span>${esc(l)}</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg></button>`).join('');
  document.body.appendChild(pop);
  const w=Math.max(r.width,200), left=Math.min(Math.max(8,r.left), window.innerWidth-w-8);
  const below=window.innerHeight-r.bottom, h=pop.offsetHeight;
  pop.style.cssText=`left:${left}px;min-width:${w}px;`+(below<h+16 && r.top>below ? `bottom:${window.innerHeight-r.top+6}px` : `top:${r.bottom+6}px`);
  pop.querySelectorAll('[data-v]').forEach(o=>o.onclick=()=>{ ddClose(); onPick(o.dataset.v); });
  const sel=pop.querySelector('[aria-selected="true"]'); if(sel) sel.scrollIntoView({block:'nearest'});
  setTimeout(()=>{ const off=e=>{ if(!pop.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){ ddClose(); document.removeEventListener('pointerdown',off,true); } }; document.addEventListener('pointerdown',off,true); },0);
}

/* 모든 기본 선택칸(<select>)을 같은 드롭다운으로 — 실제 select는 숨겨 두고 값만 주고받음 */
function enhanceSelects(root){
  (root||document).querySelectorAll('select:not([data-native]):not([data-dd-done])').forEach(sel=>{
    sel.setAttribute('data-dd-done','1');
    const btn=document.createElement('button'); btn.type='button'; btn.className='dd dd--f';
    btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
    if(sel.id) btn.setAttribute('aria-label', (sel.closest('label')?.querySelector('span')?.textContent)||sel.getAttribute('aria-label')||'');
    const paint=()=>{ const o=sel.options[sel.selectedIndex]; btn.innerHTML=`<span>${esc(o?o.textContent:'')}</span>${DD_CHEV}`; };
    paint(); sel.addEventListener('change',paint);
    sel.classList.add('dd-native'); sel.after(btn);
    btn.onclick=e=>{ e.preventDefault(); e.stopPropagation();
      if(btn.getAttribute('aria-expanded')==='true') return ddClose();
      const opts=[...sel.options].map(o=>[o.value,o.textContent]);
      ddMenu(btn, opts, sel.value, v=>{ sel.value=v; sel.dispatchEvent(new Event('change',{bubbles:true})); sel.dispatchEvent(new Event('input',{bubbles:true})); paint(); });
    };
  });
}

function taskState(t){
  if(t.done) return {k:'done',l:'완료',cls:'st--done'};
  if(!t.due) return {k:'none',l:'마감 없음',cls:'st--plan'};
  const d=daysBetween(TODAY,t.due);
  if(d<0) return {k:'late',l:`지연 ${-d}일`,cls:'st--late'};
  if(d===0) return {k:'today',l:'오늘',cls:'st--today'};
  return {k:'plan',l:`D-${d}`,cls:d<=3?'st--soon':'st--plan'};
}
function weekRange(){
  const d=new Date(TODAY+'T00:00:00'); const wd=(d.getDay()+6)%7;

  return [dateStr(mon),dateStr(sun)];
}

function guessRefCat(u){
  const s=String(u||'').toLowerCase();
  if(/threads\.(net|com)/.test(s)) return '스레드';
  if(/instagram\.com\/(reel|reels|tv)\//.test(s)) return '릴스';
  if(/instagram\.com\/p\//.test(s)) return '피드';
  if(/tiktok\.com\/.+\/video\//.test(s)) return '릴스';
  if(/youtube\.com\/shorts\//.test(s)) return '릴스';
  if(/(youtube\.com\/watch|youtu\.be\/)/.test(s)) return '릴스';
  if(/instagram\.com\/[^\/?#]+\/?($|\?)/.test(s)) return '계정';

function avgBy(list,key,metric){
  const g={};
  list.forEach(s=>{ const k=s[key]||'미지정'; (g[k]=g[k]||[]).push(Number(s[metric]||0)); });
  return Object.entries(g).map(([k,v])=>({k, n:v.length, avg: Math.round(v.reduce((a,b)=>a+b,0)/v.length)})).sort((a,b)=>b.avg-a.avg);
}

function funnelCard(bid, ym, rows){

function statsExport(scope){

  const metrics=[['views','조회수'],['likes','좋아요'],['replies','댓글'],['saves','저장'],['profile','프로필 유입'],['follows','팔로우 전환']];
  const groups=[['hook','훅유형'],['source','소재출처'],['purpose','목적태그'],['voice','화자위치'],['slot','발행시간대']];
  lines.push(''); lines.push(csvCell('속성별 평균 (건수 / '+metrics.map(m=>m[1]).join(' / ')+')'));
  lines.push(['구분','값','편수',...metrics.map(m=>m[1])].map(csvCell).join(','));
  groups.forEach(([key,label])=>{
    const keys=[...new Set(rows.map(s=>s[key]||'미지정'))];
    keys.forEach(k=>{ const sub=rows.filter(s=>(s[key]||'미지정')===k);
      const avg=m=>sub.length? Math.round(sub.reduce((a,s)=>a+Number(s[m]||0),0)/sub.length) : 0;
      lines.push([label,k,sub.length,...metrics.map(m=>avg(m[0]))].map(csvCell).join(',')); });
  });
  const sum=k=>rows.reduce((a,s)=>a+Number(s[k]||0),0);
  const siteAuto=trafficOf(b.id, UI.ym, 'threads');
  const site=siteAuto===null? rows.reduce((a,s)=>a+Number(s.site||0),0) : siteAuto;
  const inqAuto=inqCount(b.id, UI.ym, true);
  const inq=(inqAuto===null? getInq(b.id,UI.ym) : inqAuto);
  const pct=(x,y)=> y? (Math.round(x/y*1000)/10)+'%' : '';
  lines.push(''); lines.push(csvCell('구간별 전환'));
  lines.push(['구간','값','전환율'].map(csvCell).join(','));
  lines.push(['조회수',sum('views'),''].map(csvCell).join(','));
  lines.push(['프로필 유입',sum('profile'),pct(sum('profile'),sum('views'))].map(csvCell).join(','));
  lines.push(['사이트 유입',site,pct(site,sum('profile'))].map(csvCell).join(','));
  lines.push(['문의 수',inq,pct(inq,site)].map(csvCell).join(','));
  const csv='\uFEFF'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(b.name||'brand').replace(/\s+/g,'')+'_스레드분석_'+(scope==='all'?'전체':UI.ym)+'.csv';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast(rows.length+'건 내려받았습니다',2000);
}

function embedOf(url){
  const u=String(url||'').trim();
  let m;
  if((m=/instagram\.com\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i.exec(u)))
    return {kind:'instagram', src:`https://www.instagram.com/${m[1]==='reels'?'reel':m[1]}/${m[2]}/embed/`, h:640, w:400};
  if((m=/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i.exec(u)))
    return {kind:'youtube', src:`https://www.youtube.com/embed/${m[1]}`, h:315, w:560};
  if((m=/tiktok\.com\/@[^/]+\/video\/(\d+)/i.exec(u)))
    return {kind:'tiktok', src:`https://www.tiktok.com/embed/v2/${m[1]}`, h:740, w:340};
  return null;
}

function parsePlanText(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  const isUrl=l=>/(https?:\/\/|www\.|[a-z0-9-]+\.[a-z]{2,}\/)/i.test(l);
  let week='',axis='',title='',header='',refs=[],body=[],mode='body',seenFirst=false;
  for(const raw of lines){
    const l=raw.trim();
    if(!l){ if(mode!=='ref') body.push(''); continue; }
    let m;
    if(!seenFirst){ seenFirst=true;
      if(/기획안|주간\s*플랜|플랜/.test(l) && !/^주제/.test(l)){ header=l; continue; } }
    if((m=/^(\d{1,2})\s*월\s*(\d)\s*주차?$/.exec(l))){ week=`${+m[1]}월 ${+m[2]}주차`; mode='body'; continue; }
    if((m=/^주제\s*[:：]\s*(.+)$/.exec(l))){ title=m[1].trim(); mode='body'; continue; }
    if(/^레퍼런스\s*[:：]?$/.test(l)){ mode='ref'; continue; }
    if(mode==='ref'){ if(isUrl(l)){ refs.push(l); continue; } mode='body'; }
    if(isUrl(l) && l.length<300){ refs.push(l); continue; }
    if(!axis && !/\s/.test(l) && l.length<=8 && !/[:：]/.test(l) && !/^\d/.test(l)){ axis=l; continue; }
    body.push(raw);
  }
  return { week, axis, title: title||header, refs: refs.join('\n'), body: body.join('\n').replace(/\n{3,}/g,'\n\n').trim() };
}

function modal({title, body, onSave, onDelete, saveLabel='저장', footer=true}){
  $('#layer').innerHTML=`<div class="ov" data-ov>
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal__hd"><h3>${esc(title)}</h3>
        <button class="mclose" data-close aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal__bd">${body}</div>
      ${footer?`<div class="modal__ft">
        ${onDelete?`<button class="btn btn--sm btn--del" data-del>삭제</button>`:''}
        <div class="spacer" style="flex:1"></div>
        <button class="btn btn--sm" data-close>취소</button>
        <button class="btn btn--primary btn--sm" data-save>${esc(saveLabel)}</button>
      </div>`:''}
    </div></div>`;
  const close=()=>{$('#layer').innerHTML='';};
  $('#layer').querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  $('#layer').querySelector('[data-ov]').onclick=e=>{if(e.target.hasAttribute('data-ov'))close();};
  const sv=$('#layer').querySelector('[data-save]'); if(sv) sv.onclick=()=>{ if(onSave()!==false){ save(); close(); render(); } };
  const d=$('#layer').querySelector('[data-del]');
  if(d) d.onclick=()=>{ if(confirm('삭제할까요? 되돌릴 수 없습니다.')){ onDelete(); save(); close(); render(); } };
  /* PC만 첫 칸에 바로 커서 — 폰은 칸을 눌렀을 때만 키보드 */
  const first=$('#layer').querySelector('input,select,textarea'); if(first && !isMobile()) first.focus();
  fitSheet();
  enhanceSelects($('#layer'));
  $('#layer').querySelectorAll('.modal__bd input,.modal__bd textarea,.modal__bd select').forEach(el=>el.addEventListener('focus',()=>{ if(isMobile()) setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),280); }));
  document.onkeydown=e=>{ if(e.key==='Escape') close(); };
}
const opt=(arr,v)=>arr.map(a=>`<option ${a===v?'selected':''}>${esc(a)}</option>`).join('');

function shiftDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return dateStr(d); }
function moveItem(payload,target){
  const [kind,id]=payload.split(':');
  if(kind==='c'){
    const c=DB.contents.find(x=>x.id===id); if(!c) return;
    const delta=daysBetween(c.date,target);
    if(c.end) c.end=shiftDays(c.end,delta);
    c.date=target; c.dirty=true;
  } else {
    const t=DB.tasks.find(x=>x.id===id); if(!t) return;
    const wasAuto = !t.week || t.week===autoWeek(t.due);
    if(t.start&&t.due){ const delta=daysBetween(t.due,target); t.start=shiftDays(t.start,delta); t.due=target; }
    else t.due=target;
    if(wasAuto) t.week=autoWeek(t.due);
    t.dirty=true;
  }
  save(); render();
}
let selA=null, selB=null;
function paintSel(){
  document.querySelectorAll('.cell[data-date]').forEach(el=>{
    const d=el.dataset.date;
    const lo=selA<selB?selA:selB, hi=selA<selB?selB:selA;
    el.classList.toggle('cell--sel', !!selA && d>=lo && d<=hi);
  });
}
function bindCalendar(){
  if(EMBED&&EMBED.ro){
    document.querySelectorAll('#view [draggable="true"]').forEach(el=>{ el.setAttribute('draggable','false'); el.style.cursor='default'; });
    document.querySelectorAll('#view [data-newdate]').forEach(el=>el.remove());
    return;
  }
  document.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain', el.dataset.drag); e.dataTransfer.effectAllowed='move'; });
  });
  document.querySelectorAll('.cell[data-date]').forEach(cell=>{
    cell.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; });
    cell.addEventListener('drop',e=>{ e.preventDefault(); const p=e.dataTransfer.getData('text/plain'); if(p) moveItem(p, cell.dataset.date); });
    cell.addEventListener('mousedown',e=>{ if(e.target.closest('.ev, .cell__add')) return; e.preventDefault(); selA=selB=cell.dataset.date; paintSel(); });
    cell.addEventListener('mouseenter',()=>{ if(selA){ selB=cell.dataset.date; paintSel(); } });
  });
  if(!window.__calUp){
    window.__calUp=1;
    document.addEventListener('mouseup',()=>{
      if(!selA) return;
      const a=selA<selB?selA:selB, b=selA<selB?selB:selA;
      selA=selB=null; paintSel();
      if(a!==b) addOnDate(a,b);
    });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&selA){ selA=selB=null; paintSel(); } });
    window.addEventListener('blur',()=>{ if(selA){ selA=selB=null; paintSel(); } });
  }
}
function addOnDate(date,end){
  const lab=ds=>{ const d=new Date(ds+'T00:00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD_KO[d.getDay()]})`; };
  const span=end&&end!==date;
  const opt=(id,icon,t,d)=>`<button class="pick" id="${id}"><span class="pick__i">${icon}</span><b>${t}</b><span>${d}</span></button>`;
  modal({ title: span? `${lab(date)} ~ ${lab(end)}` : lab(date), footer:false,
    body:`<p>무엇을 추가할까요?</p>
      <div class="picks">
        ${opt('addOps','<svg viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12"/><path d="M9 20v-6h6v6"/></svg>','운영','행사·입고·업로드 일정')}
        ${opt('addContent','<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4-2.5z"/></svg>','콘텐츠','EGC·UGC 발행')}
        ${opt('addTask','<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>','업무','담당자·마감 있는 할 일')}
      </div>` });
  $('#addOps').onclick=()=>{ $('#layer').innerHTML=''; contentModal(null,date,'운영',end); };
  $('#addContent').onclick=()=>{ $('#layer').innerHTML=''; contentModal(null,date,'콘텐츠',end); };
  $('#addTask').onclick=()=>{ $('#layer').innerHTML=''; taskModal(null,(end||date),null,date); };

async function shrinkImage(file, maxSide, quality){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxSide/Math.max(bmp.width,bmp.height));
  const w = Math.round(bmp.width*scale), h = Math.round(bmp.height*scale);
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  const blob = await new Promise(r=>cv.toBlob(r,'image/jpeg',quality));
  return blob && blob.size < file.size ? blob : file;
}
function toB64(blob){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(blob); });
}
async function uploadAttachment(file){
  let payload = file, note='';
  if(/^image\//.test(file.type)){
    payload = await shrinkImage(file, 1600, 0.82);
    note = payload!==file ? ' (' + Math.round(file.size/1024) + 'KB → ' + Math.round(payload.size/1024) + 'KB)' : '';
  }
  if(payload.size > 9*1024*1024) throw new Error('파일이 너무 큽니다 · ' + Math.round(payload.size/1024/1024) + 'MB (9MB 이하)');
  const data = await toB64(payload);
  const r = await api({action:'upload', filename:file.name, content_type:(payload.type||file.type||'application/octet-stream'), data});
  return { id:r.id, name:file.name, mime:(payload.type||file.type||''), size:payload.size, note };
}

}

async function notionDrop(...recs){
  const ids=recs.filter(Boolean).map(r=>r.notionId).filter(Boolean);
  if(!ids.length || !DB.settings.workerUrl) return;
  let fail=0;
  for(const id of ids){ try{ await api({action:'delete', page_id:id}); }catch(e){ fail++; } }
  if(fail) toast(`노션에서 ${fail}건을 지우지 못했습니다`,3000);
  else toast(`노션에서도 삭제했습니다`,2000);
}
async function api(payload){
  const url=DB.settings.workerUrl;
  if(!url) throw new Error('Worker URL이 없습니다');
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const json=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(json.message||`요청 실패 (${res.status})`);
  return json;
}

  try{ await api({action:'ping'}); toast('연결됐습니다'); }
  catch(e){ toast('연결 실패: '+e.message,3200); }
}
async function pushAll(onlyDirty){
  const s=DB.settings; let n=0,fail=0;
  for(const kind of Object.keys(KIND)){
    const dbId=s.db[KIND[kind].db]; if(!dbId) continue;
    for(const rec of DB[kind]){
      if(onlyDirty && !rec.dirty && rec.notionId) continue;
      try{
        if(rec.notionId){ await api({action:'update', page_id:rec.notionId, properties:KIND[kind].props(rec)}); }
        else{ const r=await api({action:'create', database_id:dbId, properties:KIND[kind].props(rec)}); rec.notionId=r.id; }
        rec.dirty=false; n++;
      }catch(e){ fail++; }
    }
  }
  DB.settings.lastSync=new Date().toLocaleString('ko-KR'); save();
  if(!onlyDirty || n || fail) toast(`노션에 ${n}건 반영${fail?` · 실패 ${fail}건`:''}`,2200);
  syncing=false;
  const modalOpen=()=>!!document.querySelector('#layer')?.innerHTML.trim();
  if((!onlyDirty || n || fail) && !modalOpen()) render();
}

/* ---------- 자동 동기화 ---------- */
let syncTimer=null, syncing=false;
function autoSync(){
  if(!DB.settings.workerUrl || DB.settings.auto===false) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    if(syncing) { autoSync(); return; }
    syncing=true;
    try{ await pushAll(true); }catch(e){ syncing=false; toast('노션 반영 실패 — 설정에서 연결을 확인하세요',3000); }
  },1500);
}
async function bootSync(){
  if(!DB.settings.workerUrl || DB.settings.auto===false) return;
  try{ await pullAll(true); }catch(e){}
}
async function pushBrands(){
  const s=DB.settings; const dbId=s.db&&s.db.config;
  if(!s.workerUrl||!dbId) return;
  try{
    const res=await api({action:'query', database_id:dbId});
    const row=(res.results||[]).find(p=>(p.properties['항목']?.title?.[0]?.plain_text||'')==='brands');
    const props={ '항목':{title:[{text:{content:'brands'}}]},
      '값':{rich_text:[{text:{content:JSON.stringify(DB.brands).slice(0,1900)}}]},
      '수정시각':{rich_text:[{text:{content:new Date().toISOString()}}]} };
    if(row) await api({action:'update', page_id:row.id, properties:props});
    else await api({action:'create', database_id:dbId, properties:props});
  }catch(e){}
}
async function pullBrands(){
  const s=DB.settings; const dbId=s.db&&s.db.config;
  if(!s.workerUrl||!dbId) return;
  try{
    const res=await api({action:'query', database_id:dbId});
    const row=(res.results||[]).find(p=>(p.properties['항목']?.title?.[0]?.plain_text||'')==='brands');
    const raw=row&&row.properties['값']?.rich_text?.[0]?.plain_text;
    if(!raw){ await pushBrands(); return; }
    const list=JSON.parse(raw);
    if(Array.isArray(list)&&list.length){
      DB.brands=list.filter(b=>!isRemovedBrand(b));
      store.set(KEY,JSON.stringify(DB));
      if(DB.brands.length!==list.length) await pushBrands();
    }
  }catch(e){}
}
