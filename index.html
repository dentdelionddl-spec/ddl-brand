<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DDL 브랜드 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
:root{
  --ink:#12141A; --ink2:#343A46; --paper:#F4F5F9; --card:#FFFFFF;
  --line:#E8EAF0; --line2:#F1F2F7; --mut:#7A8194;
  --accent:#6D5AE6; --ok:#0F9D74; --warn:#B4801A; --alert:#DC4A5B;
  --r:16px;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 12px 28px -20px rgba(16,24,40,.28);
  --mono:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

/* ---------- shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}

/* 상단 브랜드 탭 */
.brandbar{background:var(--ink);display:flex;align-items:stretch;position:sticky;top:0;z-index:30;overflow-x:auto;scrollbar-width:none;padding:0 10px}
.brandbar::-webkit-scrollbar{display:none}
.blogo{display:flex;align-items:center;gap:9px;padding:0 16px 0 10px;flex:0 0 auto;background:transparent;border:0;cursor:pointer;border-right:1px solid #262B34;margin-right:6px}
.blogo:hover{opacity:.75}
.blogo img{height:19px;width:auto;display:block}
.blogo span{font-size:9px;letter-spacing:.14em;color:#7E848E;font-weight:600}
@media(max-width:860px){.blogo span{display:none}}
.btab{flex:0 0 auto;border:0;background:transparent;color:#9BA2B4;padding:12px 14px 9px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .12s}
.btab:hover{color:#E7E9F0}
.btab:hover{color:#fff;background:#1D2128}
.btab[aria-current="true"]{color:#fff;background:#20242B}
.btab__n{font-size:13px;font-weight:700;letter-spacing:-.01em}
.btab__p{font-family:var(--mono);font-size:10px;color:#767C86}
.btab[aria-current="true"] .btab__p{color:#B9BDC4}
.btab--util{margin-left:0}
.btab--me{margin-left:auto;color:#C9CBD0}
.btab--me .btab__n{font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:44px;z-index:20;background:rgba(244,245,249,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 26px 0}
.tophead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brandtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:9px}
.brandtitle .dot{width:10px;height:10px;border-radius:3px}
.brandsub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.spacer{flex:1}
.monthnav{display:flex;align-items:center;gap:0;background:transparent;border:0;border-radius:0;padding:0}
.monthnav button{border:0;background:transparent;padding:4px 7px;border-radius:8px;color:var(--mut)}
.monthnav button:last-child{padding-right:0}
.monthnav button:hover{background:var(--line2);color:var(--ink)}
.monthnav .cur{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);padding:4px 2px;min-width:88px;text-align:center}
.tabrow{display:flex;align-items:center;gap:12px;max-width:1196px;width:100%}
.tabrow .monthnav{margin-left:auto;flex:0 0 auto;margin-top:12px}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 14px;border-bottom:2px solid transparent;color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap;border-radius:10px 10px 0 0}
.tab:hover{color:var(--ink2);background:#EEF0F7}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.view{padding:24px 26px 80px;max-width:1240px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card__hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.card__hd h3{margin:0;font-size:13px;font-weight:700;letter-spacing:-.01em}
.card__bd{padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.55fr 1fr}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-weight:600;font-size:12.5px;color:var(--ink2);transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:#F7F8FC;border-color:#DCDFE9}
.btn:hover{border-color:#C9C9C0;background:#FCFCFA}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 14px -10px rgba(109,90,230,.9)}
.btn--primary:hover{background:#5B49D6;border-color:#5B49D6}
.btn--primary:hover{background:#000;border-color:#000}
.btn--ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn--ghost:hover{background:var(--line2);color:var(--ink)}
.btn--sm{padding:4px 8px;font-size:11.5px;border-radius:6px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(38,71,240,.1)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:999px;border:1px solid transparent;background:#F1F2F7;color:#6B7285;white-space:nowrap}
.tag--urgent{border-color:#E8C6CC;background:#FBEFF1;color:var(--alert)}
.tag--high{border-color:#E7DCC0;background:#FBF6E9;color:var(--warn)}
.tag--ok{border-color:#C8DED6;background:#EEF6F3;color:var(--ok)}
.empty{padding:26px 14px;text-align:center;color:var(--mut);font-size:12.5px}
.empty b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}

/* ---------- signature: pace gauge ---------- */
.gauge{margin-bottom:13px}
.gauge__hd{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.gauge__name{font-weight:600;font-size:12.5px}
.gauge__val{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.gauge__val b{color:var(--ink);font-weight:600}
.track{position:relative;height:14px;border-radius:4px;background:#EFEFEA;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);z-index:3}
.pace::after{content:'';position:absolute;top:-3px;left:-2px;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.legend span{display:flex;align-items:center;gap:5px}
.key{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- type strip ---------- */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:620px){.types{grid-template-columns:repeat(2,1fr)}}
.type{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
.type--zero{border-style:dashed;border-color:#E0C9CE;background:#FDF7F8}
.type__n{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1}
.type--zero .type__n{color:var(--alert)}
.type__l{font-size:11.5px;color:var(--mut);margin-top:3px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line2);border-top:1px solid var(--line2)}
.cal__dow{font-family:var(--mono);font-size:10px;color:var(--mut);text-align:center;padding:6px 0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:#FAFAF7}
.cell{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 5px 22px;position:relative;background:#fff}
.cell--out{background:#FAFAF8}
.cell--today{background:#F4F6FF}
.cell--sel{background:#E8EDFC!important;box-shadow:inset 0 0 0 1px #A9BCEE}
.cal{user-select:none;-webkit-user-select:none}
.ev[draggable]{user-select:none}
.cell__d{font-family:var(--mono);font-size:11px;color:var(--mut)}
.cell--today .cell__d{color:var(--accent);font-weight:600}
.cell__sun{color:var(--alert)}
.cell__add{position:absolute;right:4px;bottom:4px;border:0;background:transparent;color:#C3C3BC;font-size:15px;line-height:1;padding:2px 5px;border-radius:6px}
.cell:hover .cell__add{color:var(--ink);background:var(--line2)}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid;border-radius:4px;background:#F6F6F2;padding:3px 5px;margin-top:3px;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover{background:#EDEDE7}
.ev--task{background:#EEF1FA;border-left-color:var(--accent)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bcell{text-align:left;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card);cursor:pointer;transition:border-color .12s,background .12s}
@media(max-width:560px){
  .bcell{padding:9px 11px;display:grid;grid-template-columns:1fr auto;grid-gap:2px 8px;align-items:baseline}
  .bcell__h{margin:0}
  .bcell__h span{font-size:10.5px}
  .bcell__v{font-size:14px;margin:0;text-align:right}
  .bcell .track{grid-column:1/3;height:5px;margin-top:4px}
  .bgrid{gap:8px}
}
.bcell:hover{border-color:#C9C9C0;background:#FCFCFA}
.bcell__h{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.bcell__h b{font-size:13px;letter-spacing:-.01em}
.bcell__h span{margin-left:auto;font-size:11px;color:var(--mut)}
.bcell__v{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-bottom:7px}
.bcell__v span{font-size:11px;color:var(--mut);font-weight:400}
@media(max-width:900px){.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.bgrid{grid-template-columns:1fr}}
.brow{cursor:grab;user-select:none}
.brow.dragging{opacity:.45}
.brow.over{box-shadow:inset 0 2px 0 var(--ink)}
.grip{flex:0 0 auto;color:#B9BAB4;font-size:14px;line-height:1;margin-top:3px;letter-spacing:-2px}
.thrlist{display:flex;flex-direction:column}
.thr{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line2)}
.thr:last-child{border-bottom:0}
.thr--empty{background:repeating-linear-gradient(135deg,transparent,transparent 6px,#FAFAF7 6px,#FAFAF7 12px)}
.thr--today{box-shadow:inset 3px 0 0 var(--ink)}
.thr__d{flex:0 0 44px;text-align:center;font-family:var(--mono)}
.thr__d b{display:block;font-size:15px;font-weight:700}
.thr__d span{font-size:10px;color:var(--mut)}
.thr__b{flex:1;min-width:0}
.thr__t{font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.thr__a{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.thr__c{display:block;margin-top:2px;font-size:10px;font-style:normal;color:var(--mut)}
.post{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:var(--card);transition:background .12s,border-color .12s}
.post:last-child{margin-bottom:0}
.post:hover{background:#F1F4FD;border-color:#C7D2F0}
.post__m{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap}
.ustat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.ustat__c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}
.ustat__c--warn{border-color:#E4C9CE;background:#FCF6F6}
.ustat__n{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.02em}
.ustat__l{font-size:11px;color:var(--mut);margin-top:2px}
.ucard--done{opacity:.72}
.ugal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:start}
.ugal a{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ugal img,.ugal video{width:100%;height:auto;display:block}
@media(max-width:640px){.ustat{grid-template-columns:repeat(2,minmax(0,1fr))}.ugal{grid-template-columns:repeat(3,minmax(0,1fr))}}
.refgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.refcell{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.card[data-ref]{user-select:none}
.card.refpick{cursor:pointer;position:relative}
.card.refpick iframe{pointer-events:none}
.card.refpick::after{content:'';position:absolute;inset:0;border-radius:18px}
.card.refpick:hover{border-color:#C9C0F5}
.card.refsel{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 8px 24px -18px rgba(109,90,230,.9)}
.refcell iframe{width:100%;height:420px;display:block;border:0;background:#fff}
.refcell__u{padding:7px 9px;font-size:11px;line-height:1.5;border-top:1px solid var(--line2);word-break:break-all;background:var(--card)}
@media(max-width:1000px){.refgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.refgrid{grid-template-columns:1fr}}
.ev--task:hover{background:#E4E9F7}
.ev--done{opacity:.45;text-decoration:line-through}
@media(max-width:700px){.cell{min-height:82px}.ev{font-size:10px}}

/* ---------- tasks ---------- */
.areahd{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.areahd h3{margin:0;font-size:13px;font-weight:700}
.areahd .line{flex:1;height:1px;background:var(--line)}
.tasks2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.tasks2{grid-template-columns:1fr}}
.tk{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
.tk--done{opacity:.5}
.tk--click{cursor:pointer;transition:background .12s,border-color .12s}
.tk--click:hover{background:#F1F4FD;border-color:#C7D2F0}
.tk input[type=checkbox]{margin-top:3px;width:15px;height:15px;accent-color:var(--ink);flex:0 0 auto}
.tk__t{flex:1;min-width:0}
.tk__title{font-size:13px;font-weight:600;letter-spacing:-.01em;word-break:break-word}
.tk--done .tk__title{text-decoration:line-through}
.tk__meta{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.dday{font-family:var(--mono);font-size:11px;font-weight:600}
.dday--over{color:var(--alert)}
.dday--soon{color:var(--warn)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(20,23,28,.42);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
@media(min-width:700px){.ov{align-items:center;padding:24px}}
.modal{background:var(--card);border-radius:14px 14px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;border:1px solid var(--line)}
@media(min-width:700px){.modal{border-radius:12px}}
.modal__hd{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--card)}
.modal__hd h3{margin:0;font-size:14px;font-weight:700}
.modal__bd{padding:16px}
.modal__ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- toast / sync ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:9px 15px;border-radius:999px;font-size:12.5px;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.syncdot{width:6px;height:6px;border-radius:50%;background:#C3C3BC;display:inline-block;margin-right:6px}
.syncdot--on{background:var(--ok)}

@media(max-width:1100px){ .g2{grid-template-columns:1fr} }
@media(max-width:860px){
  .btab--util{margin-left:0}
  .btab{padding:11px 11px 8px}
  .view{padding:14px 12px 80px}
  .topbar{padding:10px 12px 0}
  .brandtitle{font-size:19px}
  .tabrow{flex-direction:column;align-items:stretch;gap:4px}
  .tabrow .monthnav{margin-left:0;margin-top:4px;align-self:flex-start}
  .row2{grid-template-columns:1fr}
  .card__bd{padding:12px}
  .modal{max-height:92vh}
}
@media(max-width:640px){
  .cal{grid-template-columns:repeat(7,minmax(44px,1fr));overflow-x:auto}
  .cell{min-height:68px}
  .cell__d{font-size:10px}
  .ev{font-size:9.5px;padding:2px 4px}
  .types{grid-template-columns:repeat(2,1fr)!important}
  .tk{flex-wrap:wrap}
  .btab__p{display:none}
  table{font-size:12px}
}

/* --- SaaS 스타일 보강 --- */
.card__hd{padding:16px 18px 12px;border-bottom:1px solid var(--line2)}
.card__hd h3{font-size:14.5px;letter-spacing:-.01em}
.card__bd{padding:16px 18px}
.grid{gap:16px}
.areahd{margin:26px 0 10px}
.areahd h3{font-size:13px;letter-spacing:-.01em}
.f input,.f select,.f textarea{border-radius:11px;background:#FBFBFD;border-color:var(--line);padding:10px 12px}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,90,230,.14);background:#fff}
.f>span{font-size:11.5px;color:#8B92A5;font-weight:600}
.modal{border-radius:20px;box-shadow:0 30px 70px -30px rgba(16,24,40,.45)}
.track{background:#EDEFF5;border-radius:999px;overflow:hidden}
.track i{border-radius:999px}
.tag--ok{background:#E7F7F1;color:#0B7A5B}
.tag--urgent{background:#FDEAED;color:#C43D4E}
.tag--high{background:#FEF4E3;color:#9A6B0E}
.ustat__c{border-radius:16px;box-shadow:var(--sh)}
.bcell{border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.03)}
.bcell:hover{border-color:#D6D9E6;background:#FBFBFE}
.tk--click:hover{background:#F5F4FE;border-color:#D9D3FA}
.cell--today{background:#F3F1FE}
.thr--today{box-shadow:inset 3px 0 0 var(--accent)}
.dday--soon{color:var(--warn)}
.type{border-radius:14px}

/* --- 여백 통일 (8 / 12 / 16 / 24) --- */
#view > * + *{margin-top:16px}
#view > *[style*="margin-top"]{margin-top:16px !important}
#view > *:first-child{margin-top:0 !important}
#view > .areahd{margin:24px 0 10px !important}
#view > .areahd:first-child{margin-top:0 !important}
#view > .areahd + *{margin-top:0 !important}
#view > section.card[style*="margin-bottom"]{margin-bottom:0 !important}
.grid{gap:16px}
.bgrid{gap:16px}
.ustat{gap:16px;margin-bottom:0 !important}
.card__hd{padding:18px 18px 14px}
.card__bd{padding:18px}

<script>
/* =========================================================
   DDL 브랜드 관리 — 단일 파일 앱
   저장: 로컬(localStorage) → 노션(Cloudflare Worker 경유) 선택 동기화
   ========================================================= */

const CONTENT_TYPES = ['EGC','UGC'];
const OPS_TYPES = ['온라인','오프라인','이벤트','제품 업로드','제품 입고'];
const TYPE_ALIAS = {'공구':'이벤트','기획전':'이벤트','피드':'EGC','릴스':'EGC','스레드':'EGC'};
const TYPES = [...CONTENT_TYPES, ...OPS_TYPES];
const TYPE_HUE = {'EGC':262,'UGC':330,'온라인':200,'오프라인':122,'이벤트':18,'제품 업로드':160,'제품 입고':38};
const catOf = t => CONTENT_TYPES.includes(t) ? '콘텐츠' : '운영';
/* 업무 영역은 고정값이 아니라 입력된 내용에서 자동 수집됩니다 */
function areasIn(bid){
  const count={};
  for(const t of DB.tasks){ const a=(t.area||'').trim(); if(!a) continue;
    if(bid && t.brandId!==bid) continue; count[a]=(count[a]||0)+1; }
  return Object.keys(count).sort((x,y)=>count[y]-count[x]||x.localeCompare(y,'ko'));
}
function allAreas(){ return areasIn(null); }
const PRIOS = ['긴급','높음','보통','낮음'];
const OWNERS = ['승호','산들','효정','재욱','정모'];
const PSTATUS = ['기획','발주','생산중','입고','업로드','판매중','드랍'];
const WEEKS = ['1주차','2주차','3주차','4주차','5주차'];
const PLAN_KINDS = ['영상','이미지','텍스트'];
const REF_CATS = ['릴스','피드','스레드','계정','구분 필요'];
const COST_KINDS = ['원가','광고비','수수료','인건비','기타'];

const SEED_BRANDS = [
  {id:'ootn',     name:'OOTN',       ko:'오오티엔',   hue:40,  client:'', channels:['자사몰','무신사','플랫폼','기타']},
  {id:'aube',     name:'AUBE SEOUL', ko:'오브서울',   hue:340, client:'', channels:['자사몰','무신사','29CM','플랫폼','기타']},
  {id:'fludk',    name:'FLUD K',     ko:'플러드케이', hue:96,  client:'', channels:['자사몰','무신사','29CM','플랫폼','기타']},
  {id:'vivicate', name:'VIVICATE',   ko:'비비케이트', hue:262, client:'이케이아이엔티', channels:['자사몰','ZVZO','29CM','플랫폼','기타']},
  {id:'ruhel',    name:'RUHEL',      ko:'루엘',       hue:200, client:'', channels:['자사몰','해외','플랫폼','기타']},
  {id:'arikiv',   name:'ARIKIV',     ko:'아리키브',   hue:24,  client:'', channels:['자사몰','무신사','29CM','플랫폼','기타']},
  {id:'usuel',    name:'USUEL',      ko:'유주엘',     hue:170, client:'', channels:['콘텐츠 업로드 수']},
  {id:'factory',  name:'공장',       ko:'용저우 공장', hue:210, client:'', channels:['오더','샘플','기타']},
  {id:'ddl',      name:'DDL',        ko:'팀 디디엘',  hue:280, client:'', channels:['대행료','기타']}
];

/* ---------- storage (localStorage, 실패 시 메모리) ---------- */
const KEY='ddl-brand-commerce-v1';
const mem={};
const store={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

/* 노션 DB (프로젝트 DDL > 🗂 브랜드 관리 아래에 생성됨) */
const NOTION_DB={
  contents:'22c3381ad8e44f239be74fdd3243eba3',
  tasks:'1b390d2a35db48d796e26edaa0834a6a', /* 브랜드별 주간 플랜 > Weekly Plan */
  sales:'5ca27a6560214303bc77b2da9e48ce02',
  products:'ddd18f71b6c9475abc59f74881cff410',
  plans:'30a5544647d84123b4ad5e106c48c64e',
  costs:'e33ee267da7d43fd86f72c28fa888114',
  actions:'21f72c37590f48dba49455f0c705b4ab',
  config:'46b8ab2d1ddc47f7b5f8c0bfa4748ab9',
  refs:'ae4c78c3a8324090b2617774d9ae3f01'
};
const NOTION_HUB='https://app.notion.com/p/3bd4f7cd6b86816cbc56ef161bf47379';
const PROXY_URL='https://ddl-brand.vercel.app/api/notion';

const blank = () => ({
  v:1,
  settings:{ workerUrl:PROXY_URL, db:{...NOTION_DB}, lastSync:null },
  brands: JSON.parse(JSON.stringify(SEED_BRANDS)),
  contents:[], tasks:[], sales:[], products:[], plans:[], costs:[], actions:[], refs:[]
});

let DB;
try{ DB = JSON.parse(store.get(KEY)) || blank(); }catch(e){ DB = blank(); }
for(const k of ['contents','tasks','sales','products','plans','costs','actions','refs']) if(!Array.isArray(DB[k])) DB[k]=[];
if(!DB.settings) DB.settings=blank().settings;
if(!DB.settings.db) DB.settings.db={...NOTION_DB};
if(DB.settings.dbv!==3){ DB.settings.db={...DB.settings.db, ...NOTION_DB}; DB.settings.dbv=3; }
for(const k in NOTION_DB) if(!DB.settings.db[k]) DB.settings.db[k]=NOTION_DB[k];
if(!DB.settings.workerUrl) DB.settings.workerUrl=PROXY_URL;
if(!DB.brands||!DB.brands.length) DB.brands=JSON.parse(JSON.stringify(SEED_BRANDS));
for(const sb of SEED_BRANDS) if(!DB.brands.some(b=>b.id===sb.id)) DB.brands.push(JSON.parse(JSON.stringify(sb)));
/* 기기마다 따로 만들어진 동명 브랜드 합치기 */
for(const sb of SEED_BRANDS){
  const dup=DB.brands.filter(b=>b.name===sb.name && b.id!==sb.id);
  for(const d of dup){
    for(const k of ['contents','tasks','sales','products','plans','costs','actions'])
      (DB[k]||[]).forEach(r=>{ if(r.brandId===d.id){ r.brandId=sb.id; r.dirty=true; } });
    DB.brands=DB.brands.filter(b=>b!==d);
  }
}
/* 브랜드 순서는 설정에서 직접 정합니다 */
for(const k of ['plans','costs','actions']) if(!Array.isArray(DB[k])) DB[k]=[];
for(const c of DB.contents){ if(TYPE_ALIAS[c.type]){ c.type=TYPE_ALIAS[c.type]; c.dirty=true; } }
for(const pl of DB.plans){ if(!pl.kind){ pl.kind='영상'; pl.dirty=true; } }
for(const pl of DB.plans){ if(pl.asset==='필요 없음'){ pl.asset='텍스트만'; pl.dirty=true; } }
for(const k of ['contents','tasks','sales','products','plans','costs','actions','refs']){
  const seen=new Set();
  DB[k]=(DB[k]||[]).filter(r=>{ if(!r.notionId) return true; if(seen.has(r.notionId)) return false; seen.add(r.notionId); return true; });
}
for(const t of DB.tasks){ if(/\d+\s*월\s*\d+\s*주/.test(t.area||'')){ t.week=t.area; t.area=''; } }

const save=()=>{ store.set(KEY,JSON.stringify(DB)); if(typeof autoSync==='function') autoSync(); };

/* ---------- utils ---------- */
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR');
const man=n=>Math.round(Number(n||0)/10000).toLocaleString('ko-KR');
const pad=n=>String(n).padStart(2,'0');
const ymOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const dateStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date(); const TODAY=dateStr(today);
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const brandOf=id=>DB.brands.find(b=>b.id===id);
const hueBg=(h,l=45)=>`hsl(${h} 42% ${l}%)`;

let UI={ brand: DB.brands[0].id, tab:'summary', ym: ymOf(today) };
const savedUI=store.get(KEY+':ui'); if(savedUI){ try{ UI=Object.assign(UI,JSON.parse(savedUI)); }catch(e){} }
const saveUI=()=>store.set(KEY+':ui',JSON.stringify(UI));

function toast(msg,ms=2200){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),ms);

/* ---------- selectors ---------- */
const inMonth=(d,ym)=>String(d||'').slice(0,7)===ym;
const contentsOf=(bid,ym)=>DB.contents.filter(c=>c.brandId===bid&&inMonth(c.date,ym));
const spans=(r,ds)=>{ const a=r.date||r.start, b=r.end||a; return a && ds>=a && ds<=b; };
const contentsSpanning=(bid,ym)=>DB.contents.filter(c=>c.brandId===bid&&(inMonth(c.date,ym)||inMonth(c.end,ym)||(c.date&&c.end&&c.date<ym+'-01'&&c.end>ym+'-31')));
const tasksSpanning=(bid,ym)=>tasksOf(bid).filter(t=>inMonth(t.due,ym)||inMonth(t.start,ym));
const salesOf=(bid,ym)=>DB.sales.filter(s=>s.brandId===bid&&s.ym===ym);
const tasksOf=bid=>DB.tasks.filter(t=>t.brandId===bid);
const productsOf=bid=>DB.products.filter(p=>p.brandId===bid);
const plansOf=(bid,ym)=>DB.plans.filter(p=>p.brandId===bid&&p.ym===ym);
const costsOf=(bid,ym)=>DB.costs.filter(c=>c.brandId===bid&&c.ym===ym);
const costTotal=(bid,ym)=>costsOf(bid,ym).reduce((a,c)=>a+Number(c.amount||0),0);
const actionsOf=(bid,ym)=>DB.actions.filter(a=>a.brandId===bid&&a.ym===ym);
const taskById=id=>DB.tasks.find(t=>t.id===id);
function actionProgress(a){
  const ids=(a.taskIds||[]).map(taskById).filter(Boolean);
  if(Number(a.goal)>0) return { cur:Number(a.cur||0), goal:Number(a.goal), pct:Math.min(100,Number(a.cur||0)/Number(a.goal)*100), byTask:false };
  const done=ids.filter(t=>t.done).length;
  return { cur:done, goal:ids.length, pct: ids.length? done/ids.length*100 : 0, byTask:true };
}
function totals(bid,ym){
  const chs=brandOf(bid)?.channels||[];
  const rows=salesOf(bid,ym).filter(r=>!chs.length||chs.includes(r.channel));
  return { goal:rows.reduce((a,r)=>a+Number(r.goal||0),0), actual:rows.reduce((a,r)=>a+Number(r.actual||0),0) };
}
function paceRatio(ym){
  const [y,m]=ym.split('-').map(Number);
  const dim=new Date(y,m,0).getDate();
  if(ym===ymOf(today)) return today.getDate()/dim;
  return (new Date(y,m-1,1) < new Date(today.getFullYear(),today.getMonth(),1)) ? 1 : 0;
}
function ymShift(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return ymOf(d); }
function ymLabel(ym){ const [y,m]=ym.split('-'); return `${y}년 ${Number(m)}월`; }

function todayUploads(bid){
  const list=(DB.contents||[]).filter(c=>{
    if(bid && c.brandId!==bid) return false;
    if(!CONTENT_TYPES.includes(c.type)) return false;
    return c.date===TODAY || (c.end && c.date<=TODAY && TODAY<=c.end);
  });
  return list.sort((x,y)=>Number(x.done)-Number(y.done)||(x.title||'').localeCompare(y.title||'','ko'));
}

function calendarView(){
  const b=brandOf(UI.brand), ym=UI.ym;
  const [y,m]=ym.split('-').map(Number);
  const first=new Date(y,m-1,1), dim=new Date(y,m,0).getDate(), lead=first.getDay();
  const onlyContent = EMBED && EMBED.only==='content';
  const cs=contentsSpanning(b.id,ym).filter(c=>!onlyContent || CONTENT_TYPES.includes(c.type));
  const calWho=(UI.taskOwner===undefined? (DB.settings.me||'') : UI.taskOwner)||'';
  const allDayTasks=tasksSpanning(b.id,ym);
  const dayTasks=(EMBED&&EMBED.only==='content')? [] : allDayTasks.filter(t=>hasOwner(t,calWho));
  const calOwners=[...new Set([...OWNERS, ...allDayTasks.flatMap(t=>ownersOf(t))])];
  const cells=[];
  for(let i=0;i<lead;i++) cells.push(`<div class="cell cell--out"></div>`);
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(m)}-${pad(d)}`;
    const evs=cs.filter(c=>spans(c,ds));
    const dow=new Date(y,m-1,d).getDay();
    const tks=dayTasks.filter(t=>spans({date:t.start||t.due,end:t.due},ds));
    cells.push(`<div class="cell ${ds===TODAY?'cell--today':''}" data-date="${ds}">
      <div class="cell__d ${dow===0?'cell__sun':''}">${d}</div>
      ${evs.map(e=>`<span class="ev ${e.done?'ev--done':''}" draggable="true" data-drag="c:${e.id}" style="border-left-color:${hueBg(TYPE_HUE[e.type]||0,55)}"><b data-toggle-content="${e.id}" title="완료 표시" style="cursor:pointer;padding:0 4px 0 0">${e.done?'✓':'□'}</b><span data-content="${e.id}" style="cursor:pointer">${e.end&&e.end!==e.date?(ds===e.date?'▶ ':(ds===e.end?'■ ':'· ')):''}${(e.att&&e.att.length)||(e.attView&&e.attView.length)?'📎':''}${esc(e.type)} · ${esc(e.title||'')}</span></span>`).join('')}
      ${tks.map(t=>`<span class="ev ev--task ${t.done?'ev--done':''}" draggable="true" data-drag="t:${t.id}"><b data-toggle-task-btn="${t.id}" title="완료 표시" style="cursor:pointer;padding:0 3px 0 0">${t.done?'✓':'□'}</b><span data-edit-task="${t.id}" style="cursor:pointer">${t.start&&t.start!==t.due?(ds===t.start?'▶ ':(ds===t.due?'■ ':'· ')):''}${esc(t.title)}</span></span>`).join('')}
      <button class="cell__add" data-newdate="${ds}" aria-label="${d}일 추가">+</button>
    </div>`);
  }
  while(cells.length%7) cells.push(`<div class="cell cell--out"></div>`);

  const chip=(label,val,on)=>`<button class="btn btn--sm" data-taskowner="${esc(val)}" style="border-radius:999px;${on?'background:var(--ink);border-color:var(--ink);color:#fff':''}">${esc(label)}</button>`;
  if(EMBED) return `<section class="card">
    <div class="card__hd"><h3>${ymLabel(ym)} 콘텐츠 캘린더</h3></div>
    <div class="cal">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal__dow">${d}</div>`).join('')}
      ${cells.join('')}
    </div>
  </section>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <span class="eyebrow">업무 담당</span>
      ${chip('전체','',!calWho)}${calOwners.map(o=>chip(o,o,calWho===o)).join('')}
      <div class="spacer" style="flex:1"></div>
      <button class="btn btn--sm btn--primary" data-newdate="${ym}-${pad(Math.min(today.getDate(),dim))}">항목 추가</button>
    </div>
  <section class="card">
    <div class="card__hd"><h3>${ymLabel(ym)} 운영 캘린더</h3>
      <span class="eyebrow" style="margin-left:auto">${calWho?esc(calWho)+' 업무만':'전체 업무'}</span></div>
    <div class="cal">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal__dow">${d}</div>`).join('')}
      ${cells.join('')}
    </div>
  </section>`;
}

/* ---------- 업무 ---------- */
function ownersOf(t){ return (Array.isArray(t.owners)&&t.owners.length)? t.owners : (t.owner? [t.owner] : []); }
function hasOwner(t,who){ return !who || ownersOf(t).includes(who); }
function ownerPicker(sel){
  const names=[...new Set([...OWNERS, ...(sel||[])])];
  return `<div class="f"><span>담당 (여러 명 선택 가능)</span>
    <div id="t_owners" style="display:flex;gap:6px;flex-wrap:wrap;padding-top:2px">
      ${names.map(n=>`<label class="btn btn--sm" style="display:inline-flex;align-items:center;gap:6px;border-radius:999px;cursor:pointer">
        <input type="checkbox" class="ownchk" value="${esc(n)}" ${ (sel||[]).includes(n)?'checked':'' } style="width:14px;height:14px;accent-color:var(--accent)" />${esc(n)}</label>`).join('')}
    </div></div>`;
}
function readOwners(){ return [...document.querySelectorAll('.ownchk:checked')].map(el=>el.value); }
function taskRow(t,compact,showBrand){
  const d = t.due? daysBetween(TODAY,t.due) : null;
  const dd = d===null? '' : (d<0? `<span class="dday dday--over">D+${-d}</span>` : d===0? `<span class="dday dday--over">D-DAY</span>` : `<span class="dday ${d<=3?'dday--soon':''}">D-${d}</span>`);
  const pcls = t.priority==='긴급'?'tag--urgent':t.priority==='높음'?'tag--high':'';
  return `<div class="tk tk--click ${t.done?'tk--done':''}" data-edit-task="${t.id}">
    <input type="checkbox" data-toggle-task="${t.id}" ${t.done?'checked':''} onclick="event.stopPropagation()" aria-label="완료 표시" />
    <div class="tk__t">
      <div class="tk__title">${esc(t.title)}</div>
      <div class="tk__meta">
        ${dd}
        ${showBrand?`<span class="tag">${esc(brandOf(t.brandId)?.name||'')}</span>`:''}
        <span class="tag ${pcls}">${esc(t.priority||'보통')}</span>
        ${t.week?`<span class="tag">${esc(t.week)}</span>`:''}
        ${ownersOf(t).map(n=>`<span class="tag">${esc(n)}</span>`).join('')}
        ${t.due?`<span class="eyebrow">${t.due.slice(5)}</span>`:''}
      </div>
    </div>
  </div>`;
}

function autoWeek(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-').map(Number);
  return `${m}월 ${Math.ceil(d/7)}주차`;
}
function weekKey(w){
  const m=/(\d+)\s*월\s*(\d+)\s*주/.exec(w||''); 
  return m? (Number(m[1])*10+Number(m[2])) : 999;
}
function tasksView(){
  const b=brandOf(UI.brand);

  const owners=[...new Set([...OWNERS, ...all.flatMap(t=>ownersOf(t))])];
  const me=DB.settings.me||'';
  const who=(UI.taskOwner===undefined? me : UI.taskOwner)||'';
  const scoped = who? all.filter(t=>hasOwner(t,who)) : all;
  const open=scoped.filter(t=>!t.done), done=scoped.filter(t=>t.done);
  const showDone = UI.taskDone===true;
  const list = showDone? done : open;
  const sorter=(x,y)=>(x.due||'9999').localeCompare(y.due||'9999')||PRIOS.indexOf(x.priority)-PRIOS.indexOf(y.priority);
  const areaOf=t=>(t.area||'').trim()||'미분류';
  const areas=[...new Set(list.map(areaOf))].sort((x,y)=>{
    const first=a=>list.filter(t=>areaOf(t)===a).map(t=>t.due||'9999-99-99').sort()[0]||'9999-99-99';
    return first(x).localeCompare(first(y)) || x.localeCompare(y,'ko');
  });
  const pct = scoped.length? Math.round(done.length/scoped.length*100):0;
  const chip=(label,val,on)=>`<button class="btn btn--sm" data-taskowner="${esc(val)}" style="border-radius:999px;${on?'background:var(--ink);border-color:var(--ink);color:#fff':''}">${esc(label)}</button>`;

        <button class="tab" data-taskview="done" aria-selected="${showDone}" style="border:0;border-radius:999px;padding:6px 14px">완료 ${done.length}</button>
      </div>
      <div class="mono" style="font-size:12.5px;color:var(--mut)">진행률 ${pct}%</div>
      <div class="track" style="flex:1;max-width:220px"><i style="width:${pct}%;background:${hueBg(b.hue,58)}"></i></div>
      <div class="spacer" style="flex:1"></div>
      <button class="btn btn--primary btn--sm" data-act="task-new">업무 추가</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${chip('담당 전체','',!who)}${owners.map(o=>chip((o===me?'나 · ':'')+o+' '+all.filter(t=>hasOwner(t,o)&&!t.done).length,o,who===o)).join('')}
    </div>
    ${!list.length? `<div class="card"><div class="empty"><b>${showDone?'완료한 업무가 없습니다':'할 일이 없습니다'}</b>${who?`담당 ${esc(who)} 기준입니다.`:'업무를 추가하거나 노션 주간 플랜에서 내려받으세요.'}</div></div>`
    : areas.map(a=>{

      return `<div class="areahd"><h3>${esc(a)}</h3><span class="line"></span><span class="eyebrow">${rows.length}건</span></div>
        ${rows.map(t=>taskRow(t,true)).join('')}`;
    }).join('')}`;
}

function guessRefCat(u){
  const s=String(u||'').toLowerCase();
  if(/threads\.(net|com)/.test(s)) return '스레드';
  if(/instagram\.com\/(reel|reels|tv)\//.test(s)) return '릴스';
  if(/instagram\.com\/p\//.test(s)) return '피드';
  if(/tiktok\.com\/.+\/video\//.test(s)) return '릴스';
  if(/youtube\.com\/shorts\//.test(s)) return '릴스';
  if(/(youtube\.com\/watch|youtu\.be\/)/.test(s)) return '릴스';
  if(/instagram\.com\/[^\/?#]+\/?($|\?)/.test(s)) return '계정';
  if(/(x\.com|twitter\.com|tiktok\.com\/@)[^\/]*\/?($|\?)/.test(s)) return '계정';
  return '구분 필요';
}

function parsePlanText(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  const isUrl=l=>/(https?:\/\/|www\.|[a-z0-9-]+\.[a-z]{2,}\/)/i.test(l);
  let week='',axis='',title='',header='',refs=[],body=[],mode='body',seenFirst=false;
  for(const raw of lines){
    const l=raw.trim();
    if(!l){ if(mode!=='ref') body.push(''); continue; }
    let m;
    if(!seenFirst){ seenFirst=true;
      if(/기획안|주간\s*플랜|플랜/.test(l) && !/^주제/.test(l)){ header=l; continue; } }
    if((m=/^(\d{1,2})\s*월\s*(\d)\s*주차?$/.exec(l))){ week=`${+m[1]}월 ${+m[2]}주차`; mode='body'; continue; }
    if((m=/^주제\s*[:：]\s*(.+)$/.exec(l))){ title=m[1].trim(); mode='body'; continue; }
    if(/^레퍼런스\s*[:：]?$/.test(l)){ mode='ref'; continue; }
    if(mode==='ref'){ if(isUrl(l)){ refs.push(l); continue; } mode='body'; }
    if(isUrl(l) && l.length<300){ refs.push(l); continue; }
    if(!axis && !/\s/.test(l) && l.length<=8 && !/[:：]/.test(l) && !/^\d/.test(l)){ axis=l; continue; }
    body.push(raw);
  }
  return { week, axis, title: title||header, refs: refs.join('\n'), body: body.join('\n').replace(/\n{3,}/g,'\n\n').trim() };
}

function modal({title, body, onSave, onDelete, saveLabel='저장'}){
  $('#layer').innerHTML=`<div class="ov" data-ov>

      <div class="modal__hd"><h3>${esc(title)}</h3>

        <div class="spacer" style="flex:1"></div>
        <button class="btn btn--sm" data-close>취소</button>
        <button class="btn btn--primary btn--sm" data-save>${esc(saveLabel)}</button>
      </div>
    </div></div>`;
  const close=()=>{$('#layer').innerHTML='';};
  $('#layer').querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  $('#layer').querySelector('[data-ov]').onclick=e=>{if(e.target.hasAttribute('data-ov'))close();};
  $('#layer').querySelector('[data-save]').onclick=()=>{ if(onSave()!==false){ save(); close(); render(); } };
  const d=$('#layer').querySelector('[data-del]');
  if(d) d.onclick=()=>{ if(confirm('삭제할까요? 되돌릴 수 없습니다.')){ onDelete(); save(); close(); render(); } };
  const first=$('#layer').querySelector('input,select,textarea'); if(first) first.focus();
  document.onkeydown=e=>{ if(e.key==='Escape') close(); };
}
const opt=(arr,v)=>arr.map(a=>`<option ${a===v?'selected':''}>${esc(a)}</option>`).join('');

function shiftDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return dateStr(d); }
function moveItem(payload,target){
  const [kind,id]=payload.split(':');
  if(kind==='c'){
    const c=DB.contents.find(x=>x.id===id); if(!c) return;
    const delta=daysBetween(c.date,target);
    if(c.end) c.end=shiftDays(c.end,delta);
    c.date=target; c.dirty=true;
  } else {
    const t=DB.tasks.find(x=>x.id===id); if(!t) return;
    const wasAuto = !t.week || t.week===autoWeek(t.due);
    if(t.start&&t.due){ const delta=daysBetween(t.due,target); t.start=shiftDays(t.start,delta); t.due=target; }
    else t.due=target;
    if(wasAuto) t.week=autoWeek(t.due);
    t.dirty=true;
  }
  save(); render();
}
let selA=null, selB=null;
function paintSel(){
  document.querySelectorAll('.cell[data-date]').forEach(el=>{
    const d=el.dataset.date;
    const lo=selA<selB?selA:selB, hi=selA<selB?selB:selA;
    el.classList.toggle('cell--sel', !!selA && d>=lo && d<=hi);
  });
}
function bindCalendar(){
  document.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain', el.dataset.drag); e.dataTransfer.effectAllowed='move'; });
  });
  document.querySelectorAll('.cell[data-date]').forEach(cell=>{
    cell.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; });
    cell.addEventListener('drop',e=>{ e.preventDefault(); const p=e.dataTransfer.getData('text/plain'); if(p) moveItem(p, cell.dataset.date); });
    cell.addEventListener('mousedown',e=>{ if(e.target.closest('.ev, .cell__add')) return; e.preventDefault(); selA=selB=cell.dataset.date; paintSel(); });
    cell.addEventListener('mouseenter',()=>{ if(selA){ selB=cell.dataset.date; paintSel(); } });
  });
  if(!window.__calUp){
    window.__calUp=1;
    document.addEventListener('mouseup',()=>{
      if(!selA) return;
      const a=selA<selB?selA:selB, b=selA<selB?selB:selA;
      selA=selB=null; paintSel();
      if(a!==b) addOnDate(a,b);
    });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&selA){ selA=selB=null; paintSel(); } });
    window.addEventListener('blur',()=>{ if(selA){ selA=selB=null; paintSel(); } });
  }
}

async function shrinkImage(file, maxSide, quality){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxSide/Math.max(bmp.width,bmp.height));
  const w = Math.round(bmp.width*scale), h = Math.round(bmp.height*scale);
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  const blob = await new Promise(r=>cv.toBlob(r,'image/jpeg',quality));
  return blob && blob.size < file.size ? blob : file;
}
function toB64(blob){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(blob); });
}
async function uploadAttachment(file){
  let payload = file, note='';
  if(/^image\//.test(file.type)){
    payload = await shrinkImage(file, 1600, 0.82);
    note = payload!==file ? ' (' + Math.round(file.size/1024) + 'KB → ' + Math.round(payload.size/1024) + 'KB)' : '';
  }
  if(payload.size > 9*1024*1024) throw new Error('파일이 너무 큽니다 · ' + Math.round(payload.size/1024/1024) + 'MB (9MB 이하)');
  const data = await toB64(payload);
  const r = await api({action:'upload', filename:file.name, content_type:(payload.type||file.type||'application/octet-stream'), data});
  return { id:r.id, name:file.name, mime:(payload.type||file.type||''), size:payload.size, note };
}

async function notionDrop(...recs){
  const ids=recs.filter(Boolean).map(r=>r.notionId).filter(Boolean);
  if(!ids.length || !DB.settings.workerUrl) return;
  let fail=0;
  for(const id of ids){ try{ await api({action:'delete', page_id:id}); }catch(e){ fail++; } }
  if(fail) toast(`노션에서 ${fail}건을 지우지 못했습니다`,3000);
  else toast(`노션에서도 삭제했습니다`,2000);
}
async function api(payload){
  const url=DB.settings.workerUrl;
  if(!url) throw new Error('Worker URL이 없습니다');
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const json=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(json.message||`요청 실패 (${res.status})`);
  return json;
}
async function testConn(){
  try{ await api({action:'ping'}); toast('연결됐습니다'); }
  catch(e){ toast('연결 실패: '+e.message,3200); }
}
async function pushAll(onlyDirty){
  const s=DB.settings; let n=0,fail=0;
  for(const kind of Object.keys(KIND)){
    const dbId=s.db[KIND[kind].db]; if(!dbId) continue;
    for(const rec of DB[kind]){
      if(onlyDirty && !rec.dirty && rec.notionId) continue;
      try{
        if(rec.notionId){ await api({action:'update', page_id:rec.notionId, properties:KIND[kind].props(rec)}); }
        else{ const r=await api({action:'create', database_id:dbId, properties:KIND[kind].props(rec)}); rec.notionId=r.id; }
        rec.dirty=false; n++;
      }catch(e){ fail++; }
    }
  }
  DB.settings.lastSync=new Date().toLocaleString('ko-KR'); save();
  if(!onlyDirty || n || fail) toast(`노션에 ${n}건 반영${fail?` · 실패 ${fail}건`:''}`,2200);
  syncing=false;
  const modalOpen=()=>!!document.querySelector('#layer')?.innerHTML.trim();
  if((!onlyDirty || n || fail) && !modalOpen()) render();
}

/* ---------- 자동 동기화 ---------- */
let syncTimer=null, syncing=false;
function autoSync(){
  if(!DB.settings.workerUrl || DB.settings.auto===false) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    if(syncing) { autoSync(); return; }
    syncing=true;
    try{ await pushAll(true); }catch(e){ syncing=false; toast('노션 반영 실패 — 설정에서 연결을 확인하세요',3000); }
  },1500);
}
async function bootSync(){
  if(!DB.settings.workerUrl || DB.settings.auto===false) return;
  try{ await pullAll(true); }catch(e){}
}
async function pushBrands(){
  const s=DB.settings; const dbId=s.db&&s.db.config;
  if(!s.workerUrl||!dbId) return;
  try{
    const res=await api({action:'query', database_id:dbId});
    const row=(res.results||[]).find(p=>(p.properties['항목']?.title?.[0]?.plain_text||'')==='brands');
    const props={ '항목':{title:[{text:{content:'brands'}}]},
      '값':{rich_text:[{text:{content:JSON.stringify(DB.brands).slice(0,1900)}}]},
      '수정시각':{rich_text:[{text:{content:new Date().toISOString()}}]} };
    if(row) await api({action:'update', page_id:row.id, properties:props});
    else await api({action:'create', database_id:dbId, properties:props});
  }catch(e){}
}
async function pullBrands(){
  const s=DB.settings; const dbId=s.db&&s.db.config;
  if(!s.workerUrl||!dbId) return;
  try{
    const res=await api({action:'query', database_id:dbId});
    const row=(res.results||[]).find(p=>(p.properties['항목']?.title?.[0]?.plain_text||'')==='brands');
    const raw=row&&row.properties['값']?.rich_text?.[0]?.plain_text;
    if(!raw){ await pushBrands(); return; }
    const list=JSON.parse(raw);
    if(Array.isArray(list)&&list.length){
      DB.brands=list;
      for(const sb of SEED_BRANDS) if(!DB.brands.some(b=>b.id===sb.id)) DB.brands.push(JSON.parse(JSON.stringify(sb)));
      store.set(KEY,JSON.stringify(DB));
    }
  }catch(e){}
}

  await pullBrands();
  const s=DB.settings; let n=0;

        unit:txt(P['단위']), memo:txt(P['메모']),
        taskIds:txt(P['연결업무']).split(',').map(x=>x.trim()).filter(Boolean)}); }
      if(kind==='refs'){ Object.assign(rec,{brandId:brandByName(sel(P['브랜드'])), cat:sel(P['분류'])||'릴스',
        title:ttl(P['제목']), url:P['링크']?.url||'', memo:txt(P['메모'])}); }
      if(kind==='costs'){ Object.assign(rec,{brandId:brandByName(sel(P['브랜드'])), ym:txt(P['월']),
        kind:sel(P['구분'])||'기타', name:ttl(P['항목']), amount:P['금액']?.number||0}); }
      if(kind==='products'){ Object.assign(rec,{brandId:brandByName(sel(P['브랜드'])), name:ttl(P['제품명']),
        sku:txt(P['SKU']), status:sel(P['상태'])||'기획', price:P['판매가']?.number||'', stock:P['재고']?.number??'',
        eta:P['입고예정']?.date?.start||''}); }
      n++;
    }
  }
  DB.settings.lastSync=new Date().toLocaleString('ko-KR'); save();
  if(!quiet) toast(`노션에서 ${n}건 내려받았습니다`,3000);
  if((!quiet || before!==snap()) && !document.querySelector('#layer')?.innerHTML.trim()) render();
}

/* =========================================================
   EVENTS
   ========================================================= */
function bind(){
  document.querySelectorAll('[data-brand]').forEach(el=>el.onclick=()=>{
    UI.brand=el.dataset.brand; UI.tab='summary'; if(!['__set'].includes(UI.brand)&&!['summary','calendar','kpi','tasks','plans','sales','products'].includes(UI.tab)) UI.tab='summary';
    saveUI(); render();
  });
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{ UI.tab=el.dataset.tab; saveUI(); render(); });
  document.querySelectorAll('[data-taskview]').forEach(el=>el.onclick=()=>{ UI.taskDone=(el.dataset.taskview==='done'); saveUI(); render(); });
  document.querySelectorAll('[data-taskowner]').forEach(el=>el.onclick=()=>{ UI.taskOwner=el.dataset.taskowner||''; saveUI(); render(); });
  document.querySelectorAll('[data-mo]').forEach(el=>el.onclick=()=>{
    const n=Number(el.dataset.mo); UI.ym = n===0? ymOf(today) : ymShift(UI.ym,n); saveUI(); render();
  });
  document.querySelectorAll('[data-newdate]').forEach(el=>el.onclick=()=>addOnDate(el.dataset.newdate));
  document.querySelectorAll('[data-content]').forEach(el=>el.onclick=()=>contentModal(el.dataset.content));
  document.querySelectorAll('[data-edit-task]').forEach(el=>el.onclick=()=>taskModal(el.dataset.editTask));
  document.querySelectorAll('[data-edit-prod]').forEach(el=>el.onclick=()=>prodModal(el.dataset.editProd));
  document.querySelectorAll('[data-edit-plan]').forEach(el=>el.onclick=()=>planModal(el.dataset.editPlan));
  document.querySelectorAll('[data-gobrand]').forEach(el=>el.onclick=()=>{ UI.brand=el.dataset.gobrand; UI.tab='summary'; saveUI(); render(); });
  document.querySelectorAll('[data-ptab]').forEach(el=>el.onclick=()=>{ UI.planTab=el.dataset.ptab; saveUI(); render(); });
  document.querySelectorAll('[data-refcat]').forEach(el=>el.onclick=()=>{ UI.refCat=el.dataset.refcat; saveUI(); render(); });
  document.querySelectorAll('[data-edit-ref]').forEach(el=>el.onclick=()=>refModal(el.dataset.editRef));
  bindRefSelect();
  document.querySelectorAll('[data-uptab]').forEach(el=>el.onclick=()=>{ UI.upTab=el.dataset.uptab; saveUI(); render(); });
  document.querySelectorAll('[data-plankind]').forEach(el=>el.onclick=()=>{ UI.planKind=el.dataset.plankind||''; saveUI(); render(); });
  document.querySelectorAll('[data-newupload]').forEach(el=>el.onclick=()=>contentModal(null, el.dataset.newupload, '콘텐츠'));
  document.querySelectorAll('[data-newthread]').forEach(el=>el.onclick=()=>{
    planModalWith({id:uid(),brandId:UI.brand,ym:UI.ym,kind:'텍스트',date:el.dataset.newthread,week:'1주차',axis:'',title:'',refs:'',body:'',done:false}, true);
  });
  document.querySelectorAll('[data-play]').forEach(el=>el.onclick=()=>{
    const [pid,idx]=el.dataset.play.split('|');
    const pl=DB.plans.find(x=>x.id===pid); if(!pl) return;
    const url=(pl.refs||'').split('\n').map(r=>r.trim()).filter(Boolean)[Number(idx)];
    toggleEmbed(pid, idx, url);
    el.textContent = document.getElementById(`emb_${pid}_${idx}`).innerHTML? '✕ 닫기' : '▶ 재생';
  });
  document.querySelectorAll('[data-edit-cost]').forEach(el=>el.onclick=()=>costModal(el.dataset.editCost));
  document.querySelectorAll('[data-edit-action]').forEach(el=>el.onclick=()=>actionModal(el.dataset.editAction));
  document.querySelectorAll('[data-link-action]').forEach(el=>el.onclick=()=>linkTaskModal(el.dataset.linkAction));
  document.querySelectorAll('[data-newtask-action]').forEach(el=>el.onclick=()=>taskModal(null,'',el.dataset.newtaskAction));
  document.querySelectorAll('[data-edit-brand]').forEach(el=>el.onclick=()=>brandModal(el.dataset.editBrand));
  document.querySelectorAll('[data-hide-brand]').forEach(el=>el.onclick=()=>{
    const b=DB.brands.find(x=>x.id===el.dataset.hideBrand); if(!b) return;
    b.hidden=!b.hidden;
    if(b.hidden && UI.brand===b.id) UI.brand='__home';
    save(); pushBrands(); saveUI(); render();
    toast(b.name+(b.hidden?' 숨김':' 표시'),1800);
  });
  let dragId=null;
  document.querySelectorAll('[data-brandrow]').forEach(row=>{
    row.addEventListener('dragstart',e=>{ dragId=row.dataset.brandrow; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragId); });
    row.addEventListener('dragend',()=>{ dragId=null; document.querySelectorAll('.brow').forEach(r=>r.classList.remove('dragging','over')); });
    row.addEventListener('dragover',e=>{ e.preventDefault(); row.classList.add('over'); });
    row.addEventListener('dragleave',()=>row.classList.remove('over'));
    row.addEventListener('drop',e=>{
      e.preventDefault(); row.classList.remove('over');
      const from=dragId||e.dataTransfer.getData('text/plain'); const to=row.dataset.brandrow;
      if(!from||from===to) return;
      const list=DB.brands.slice();
      const fi=list.findIndex(b=>b.id===from), ti=list.findIndex(b=>b.id===to);
      if(fi<0||ti<0) return;
      const [moved]=list.splice(fi,1); list.splice(ti,0,moved);
      DB.brands=list; save(); pushBrands(); render(); toast('브랜드 순서를 바꿔습니다',1800);
    });
  });
  document.querySelectorAll('[data-toggle-content]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const c=DB.contents.find(x=>x.id===el.dataset.toggleContent); if(!c) return;
    c.done=!c.done; c.dirty=true; save(); render();
  });
  document.querySelectorAll('[data-toggle-task-btn]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const t=DB.tasks.find(x=>x.id===el.dataset.toggleTaskBtn); if(!t) return;
    t.done=!t.done; t.dirty=true; save(); render();
  });
  document.querySelectorAll('[data-toggle-task]').forEach(el=>el.onchange=()=>{
    const t=DB.tasks.find(x=>x.id===el.dataset.toggleTask); t.done=el.checked; t.dirty=true; save(); render();
  });
  document.querySelectorAll('[data-sale]').forEach(el=>el.onchange=()=>{
    const ch=el.dataset.sale, f=el.dataset.f;
    let r=DB.sales.find(s=>s.brandId===UI.brand&&s.ym===UI.ym&&s.channel===ch);
    if(!r){ r={id:uid(),brandId:UI.brand,ym:UI.ym,channel:ch,goal:0,actual:0}; DB.sales.push(r); }
    r[f]=Number(el.value||0); r.dirty=true; save(); render();
  });
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>act(el.dataset.act));
  if(UI.tab==='calendar') bindCalendar();
}

function act(a){
  if(a==='me') return meModal();
  if(a==='go-summary'){ UI.tab='summary'; saveUI(); render(); return; }
  if(a==='home'){ UI.brand='__home'; UI.ym=ymOf(today); saveUI(); render(); return; }
  if(a==='task-new') return taskModal(null);
  if(a==='prod-new') return prodModal(null);
  if(a==='plan-new') return planModal(null);
  if(a==='ref-new') return refModal(null);
  if(a==='ref-bulk') return bulkRefModal();
  if(a==='thr-past'){ UI.thrPast=!UI.thrPast; saveUI(); render(); return; }
  if(a==='ref-select'){ refMode=true; refSel.clear(); render(); return; }
  if(a==='ref-selcancel'){ refMode=false; refSel.clear(); render(); return; }
  if(a==='ref-del') return deleteSelectedRefs();
  if(a==='cost-new') return costModal(null);
  if(a==='action-new') return actionModal(null);
  if(a==='brand-new') return brandModal(null);
  if(a==='save-sync'){
    DB.settings.workerUrl=$('#setWorker').value.trim().replace(/\/$/,'');
    DB.settings.db={contents:$('#db_contents').value.trim(),tasks:$('#db_tasks').value.trim(),
                    sales:$('#db_sales').value.trim(),products:$('#db_products').value.trim(),
                    plans:$('#db_plans').value.trim(),costs:$('#db_costs').value.trim(),
                    actions:$('#db_actions').value.trim()};
    DB.settings.auto=$('#autoSync').checked;
    save(); toast('설정을 저장했습니다'); render(); return;
  }
  if(a==='test') return testConn();
  if(a==='push') return pushAll();
  if(a==='pull') return pullAll();
  if(a==='export'){
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const link=document.createElement('a');
    link.href=url; link.download=`ddl-brand-commerce-${TODAY}.json`; link.click(); URL.revokeObjectURL(url);
    return toast('내보냈습니다');
  }
  if(a==='import'){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
      const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
          if(!d.brands) throw new Error('형식이 다릅니다'); DB=d; save(); toast('불러왔습니다'); render();
        }catch(e){ toast('불러오기 실패: '+e.message,3000); } }; rd.readAsText(f); };
    inp.click(); return;
  }
  if(a==='reset'){
    if(confirm('모든 데이터를 지웁니다. 먼저 내보내기를 권합니다. 계속할까요?')){ DB=blank(); save(); toast('초기화했습니다'); render(); }
  }
}

/* 새로 접속하면 항상 홈 화면부터 */
if(!EMBED){ UI.brand='__home'; UI.ym=ymOf(today); UI.thrPast=false; saveUI(); }
render();
bootSync();
/* 자동 갱신 */
function liveRefresh(){
  if(!DB.settings.workerUrl || DB.settings.auto===false) return;
  if(document.querySelector('#layer')?.innerHTML) return;
  pullAll(true).catch(()=>{});
}
if(EMBED) setInterval(liveRefresh, 30000);
/* 임베드 높이를 부모 페이지에 알림 */
if(EMBED){
  const postH=()=>{ try{ const el=document.getElementById('view'); const h=el? el.getBoundingClientRect().height+28 : document.documentElement.scrollHeight; parent.postMessage({ddlHeight: Math.ceil(h)}, '*'); }catch(e){} };
  try{ new ResizeObserver(postH).observe(document.body); }catch(e){}
  window.addEventListener('load', postH);
  setTimeout(postH, 400); setInterval(postH, 1500);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) liveRefresh(); });
window.addEventListener('focus', liveRefresh);
</script>
