function act(a){
  if(a==='me') return meModal();
  if(a==='share') return shareBrandLink();
  if(a==='mine'){ if(!DB.settings.me) return meModal(); UI.mine=!myFilter(); saveUI(); render(); return; }
  if(a==='nav-brands'){ const sub=document.querySelector('.snav__sub'); UI.navBrands=!!(sub&&sub.hidden); saveUI(); render(); return; }
  if(a==='go-summary'){ UI.tab='calendar'; saveUI(); render(); return; }
  if(a==='home'){ if(SHARE_KEY) return; UI.brand=HOME_BRAND(); UI.tab='calendar'; UI.ym=ymOf(today); saveUI(); render(); return; }
  if(a==='task-new') return taskModal(null);
  if(a==='prod-new') return prodModal(null);
  if(a==='plan-new') return planModal(null);
  if(a==='ref-new') return refModal(null);
  if(a==='ref-bulk') return bulkRefModal();
  if(a==='stat-new') return statModal(null);
  if(a==='stat-xls') return statsExport('month');
  if(a==='stat-xls-all') return statsExport('all');
  if(a==='thr-past'){ UI.thrPast=!UI.thrPast; saveUI(); render(); return; }
  if(a==='ref-select'){ refMode=true; refSel.clear(); render(); return; }
  if(a==='ref-selcancel'){ refMode=false; refSel.clear(); render(); return; }
  if(a==='ref-del') return deleteSelectedRefs();
  if(a==='cost-new') return costModal(null);
  if(a==='action-new') return actionModal(null);
  if(a==='brand-new') return brandModal(null);
  if(a==='save-sync'){
    DB.settings.workerUrl=$('#setWorker').value.trim().replace(/\/$/,'');
    DB.settings.db={contents:$('#db_contents').value.trim(),tasks:$('#db_tasks').value.trim(),
                    sales:$('#db_sales').value.trim(),products:$('#db_products').value.trim(),
                    plans:$('#db_plans').value.trim(),costs:$('#db_costs').value.trim(),
                    actions:$('#db_actions').value.trim()};
    DB.settings.auto=$('#autoSync').checked;
    save(); toast('설정을 저장했습니다'); render(); return;
  }
  if(a==='test') return testConn();
  if(a==='push') return pushAll();
  if(a==='pull') return pullAll();
  if(a==='export'){
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const link=document.createElement('a');
    link.href=url; link.download=`ddl-brand-commerce-${TODAY}.json`; link.click(); URL.revokeObjectURL(url);
    return toast('내보냈습니다');
  }
  if(a==='import'){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
      const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
          if(!d.brands) throw new Error('형식이 다릅니다'); DB=d; save(); toast('불러왔습니다'); render();
        }catch(e){ toast('불러오기 실패: '+e.message,3000); } }; rd.readAsText(f); };
    inp.click(); return;
  }
  if(a==='reset'){
    if(confirm('모든 데이터를 지웁니다. 먼저 내보내기를 권합니다. 계속할까요?')){ DB=blank(); save(); toast('초기화했습니다'); render(); }
  }
}

/* 새로 접속하면 항상 홈 화면부터 */
if(SHARE_KEY){ document.body.classList.add('share'); UI.tab='calendar'; UI.mTab='brands'; UI.ym=ymOf(today); }
else if(!EMBED){ UI.brand='__home'; UI.ym=ymOf(today); UI.thrPast=false; UI.linkDone=false; saveUI(); }
/* 공유 링크: 브랜드 목록만 먼저 받아서 바로 화면을 띄우고, 나머지 데이터는 이어서 채움 */
if(SHARE_KEY){
  if(shareBrand()) window.__shareChecked=true;
  else pullBrands().catch(()=>{}).finally(()=>{ window.__shareChecked=true; render(); });
}
render();
bootSync();
/* 자동 갱신 */
function liveRefresh(){
  if(!DB.settings.workerUrl || DB.settings.auto===false) return;
  if(document.querySelector('#layer')?.innerHTML) return;
  pullAll(true).catch(()=>{});
}
if(EMBED) setInterval(liveRefresh, 30000);
/* 임베드 높이를 부모 페이지에 알림 */
if(EMBED){
  const postH=()=>{ try{ const el=document.getElementById('view'); const h=el? el.getBoundingClientRect().height+28 : document.documentElement.scrollHeight; parent.postMessage({ddlHeight: Math.ceil(h)}, '*'); }catch(e){} };
  try{ new ResizeObserver(postH).observe(document.body); }catch(e){}
  window.addEventListener('load', postH);
  setTimeout(postH, 400); setInterval(postH, 1500);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) liveRefresh(); });
window.addEventListener('focus', liveRefresh);
</script>
<script>
window.addEventListener("error", function(e){ window.__bootErr = (e && e.message) || "오류"; });
setTimeout(function(){
  var v = document.getElementById("view");
  if (v && v.innerHTML.trim()) return;
  var app = document.getElementById("app"); if(!app) return;
  app.innerHTML = '<div style="max-width:520px;margin:80px auto;padding:24px;border:1px solid #E2E2DA;border-radius:14px;font:14px/1.7 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#fff">'+
    '<b style="font-size:15px">화면을 불러오지 못했습니다</b><br>'+
    '<span style="color:#6B6B64">잠시 후 다시 시도하거나, 아래 버튼으로 이 브라우저의 임시 저장본을 지우고 노션에서 다시 받아올 수 있습니다. 노션 데이터는 지워지지 않습니다.</span>'+
    '<div style="margin-top:8px;color:#9A9A93;font-size:12px">'+ (window.__bootErr||"") +'</div>'+
    '<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button id="__rl" style="padding:9px 14px;border-radius:9px;border:1px solid #E2E2DA;background:#fff;cursor:pointer">새로고침</button>'+
      '<button id="__rs" style="padding:9px 14px;border-radius:9px;border:1px solid #1A1A18;background:#1A1A18;color:#fff;cursor:pointer">임시 저장본 지우고 다시 열기</button>'+
    '</div></div>';
  document.getElementById("__rl").onclick = function(){ location.reload(); };
  document.getElementById("__rs").onclick = function(){
    try{ localStorage.removeItem("ddl-brand-commerce-v1"); localStorage.removeItem("ddl-brand-commerce-v1:ui"); }catch(err){}
    location.reload();
  };
}, 2000);
</script>
